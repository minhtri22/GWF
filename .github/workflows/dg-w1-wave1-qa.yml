name: DG-W1 Wave 1 Requalification Gate

on:
  workflow_dispatch:
  push:
    branches: ["v0.8.6-dg-w1-wave1-exit-gate"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  dg-w1-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python dependencies
        run: python -m pip install -U pip && pip install -e ".[dev]"

      - name: Install exact markdownlint-cli2
        run: npm install --no-save --ignore-scripts --no-audit --no-fund markdownlint-cli2@0.23.3

      - name: Install exact Vale release with upstream checksum
        shell: bash
        run: |
          set -euo pipefail
          VERSION="3.22.0"
          BASE="https://github.com/vale-cli/vale/releases/download/v$VERSION"
          cd /tmp
          curl -fsSLo "vale_${VERSION}_Linux_64-bit.tar.gz" "$BASE/vale_${VERSION}_Linux_64-bit.tar.gz"
          curl -fsSLo "vale_${VERSION}_checksums.txt" "$BASE/vale_${VERSION}_checksums.txt"
          grep "vale_${VERSION}_Linux_64-bit.tar.gz" "vale_${VERSION}_checksums.txt" | sha256sum -c -
          mkdir -p /tmp/vale-bin
          tar -xzf "vale_${VERSION}_Linux_64-bit.tar.gz" -C /tmp/vale-bin
          chmod +x /tmp/vale-bin/vale
          /tmp/vale-bin/vale --version

      - name: Install exact Lychee release with upstream checksum
        shell: bash
        run: |
          set -euo pipefail
          VERSION="0.24.2"
          TAG="lychee-v$VERSION"
          ASSET="lychee-x86_64-unknown-linux-gnu.tar.gz"
          BASE="https://github.com/lycheeverse/lychee/releases/download/$TAG"
          cd /tmp
          curl -fsSLo "$ASSET" "$BASE/$ASSET"
          curl -fsSLo "$ASSET.sha256" "$BASE/$ASSET.sha256"
          sha256sum -c "$ASSET.sha256"
          mkdir -p /tmp/lychee-bin
          tar -xzf "$ASSET" -C /tmp/lychee-bin
          test -x /tmp/lychee-bin/lychee-x86_64-unknown-linux-gnu/lychee
          /tmp/lychee-bin/lychee-x86_64-unknown-linux-gnu/lychee --version

      - name: Wave 1 unit and compatibility tests
        run: >-
          python -m pytest -q
          tests/test_document_validation_p0.py
          tests/test_document_validation_p1.py
          tests/test_document_validation_p2.py
          tests/test_dg_p3_git_blob_resolver.py
          tests/test_v084_github_plugin_sha_qa.py
          tests/test_v085_domain_skills.py

      - name: Re-run real P0 gate
        run: >-
          python tools/run_dg_p0_gate.py
          --executable "$GITHUB_WORKSPACE/node_modules/.bin/markdownlint-cli2"
          --out evidence/dg-w1/p0.json

      - name: Re-run real P1 gate
        run: >-
          python tools/run_dg_p1_gate.py
          --executable /tmp/vale-bin/vale
          --out evidence/dg-w1/p1.json

      - name: Re-run real P2 gate
        run: >-
          python tools/run_dg_p2_gate.py
          --executable /tmp/lychee-bin/lychee-x86_64-unknown-linux-gnu/lychee
          --out evidence/dg-w1/p2.json

      - name: Re-run real P3 gate
        run: >-
          python tools/run_dg_p3_gate.py
          --repository "${{ github.repository }}"
          --commit "${{ github.sha }}"
          --path "docs/DG_P3_GIT_BLOB_RESOLVER_SPEC.md"
          --expected-repository-id "1374857546"
          --out evidence/dg-w1/p3.json

      - name: Aggregate Wave 1 QA
        run: >-
          python tools/run_dg_w1_gate.py
          --commit "${{ github.sha }}"
          --out evidence/dg-w1/DG_W1_QA.json

      - name: Assert Wave 1 QA
        run: |
          python - <<'PY'
          import json
          d=json.load(open('evidence/dg-w1/DG_W1_QA.json', encoding='utf-8'))
          assert d['status']=='PASS', d
          assert all(v=='PASS' for v in d['component_status'].values()), d
          assert all(d['checks'].values()), d
          assert d['forbidden_runtime_hits']==[], d
          PY

      - name: Compile
        run: python -m compileall -q src tests tools

      - name: Upload Wave 1 QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gwr-dg-w1-wave1-qa
          path: evidence/dg-w1
