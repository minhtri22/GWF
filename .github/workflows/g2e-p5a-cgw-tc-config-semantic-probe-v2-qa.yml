name: G2E P5A-CGW TC offline config semantic probe v2 QA

on:
  push:
    branches:
      - research/p5a-cgw-fx001-transport-corrected
    paths:
      - "g2e/docs/P5A_CGW_FX001_TC_CONFIG_SEMANTIC_PROBE_V2_PLAN.md"
      - "scripts/g2e/p5a_cgw_tc_config_semantic_probe_v2.py"
      - "tests/g2e/test_p5a_cgw_tc_config_semantic_probe_v2.py"
      - ".github/workflows/g2e-p5a-cgw-tc-config-semantic-probe-v2-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zero-model:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install pytest PyYAML
      - name: Static offline semantic-probe v2 QA
        run: python -m pytest -q tests/g2e/test_p5a_cgw_tc_config_semantic_probe_v2.py
