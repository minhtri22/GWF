name: G2E P5A Codex Observability Qualification

on:
  workflow_dispatch:
  push:
    branches: ["feature/g2e-framework"]
    paths:
      - "scripts/g2e/p5a_codex_observability.py"
      - "tests/g2e/test_p5a_codex_observability_qualification.py"
      - ".github/workflows/g2e-p5a-codex-observability-qualification.yml"

permissions:
  contents: read

jobs:
  observability-static:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: src
      BASELINE_SHA: "d0b7ef2394d8223bf519a92777fa4ddeee05ef5c"
      CODEX_COMMIT: "3d2ee51ca2d5db578f328aa75e20aa22c0197c9a"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -U pip && pip install -e ".[dev]"

      - name: Verify bounded OQ1 diff
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$BASELINE_SHA^{commit}"
          mapfile -t changed < <(git diff --name-only "$BASELINE_SHA"...HEAD)
          printf '%s\n' "${changed[@]}"
          allowed=(
            ".github/workflows/g2e-p5a-codex-observability-qualification.yml"
            "scripts/g2e/p5a_codex_observability.py"
            "tests/g2e/test_p5a_codex_observability_qualification.py"
          )
          for path in "${changed[@]}"; do
            ok=false
            for item in "${allowed[@]}"; do
              if [[ "$path" == "$item" ]]; then ok=true; break; fi
            done
            if [[ "$ok" != true ]]; then
              echo "Out-of-scope P5A Codex OQ1 mutation: $path" >&2
              exit 1
            fi
          done

      - name: Compile observability component
        run: python -m compileall -q scripts/g2e/p5a_codex_observability.py

      - name: Run privacy and synthetic failed-turn qualification
        run: pytest -q tests/g2e/test_p5a_codex_observability_qualification.py

      - name: Fetch exact rust-v0.153.4 protocol artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p upstream
          base="https://raw.githubusercontent.com/openai/codex/$CODEX_COMMIT"
          curl --fail --silent --show-error --location             "$base/codex-rs/app-server-protocol/src/protocol/v2/thread_data.rs"             -o upstream/thread_data.rs
          curl --fail --silent --show-error --location             "$base/codex-rs/app-server-protocol/src/protocol/v2/notification.rs"             -o upstream/notification.rs
          curl --fail --silent --show-error --location             "$base/codex-rs/app-server-protocol/schema/json/v2/ErrorNotification.json"             -o upstream/ErrorNotification.json
          curl --fail --silent --show-error --location             "$base/codex-rs/app-server-protocol/schema/json/v2/TurnCompletedNotification.json"             -o upstream/TurnCompletedNotification.json

      - name: Verify exact upstream Git blob identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object upstream/thread_data.rs)" = "649a94be493dadac887a9eb67cecae1365ff3c1e"
          test "$(git hash-object upstream/notification.rs)" = "ca0e7753f3cb3c007e544b3507881b6cffeecacd"
          test "$(git hash-object upstream/ErrorNotification.json)" = "69187dd539dfa5f676397444b3e36a426884b81d"
          test "$(git hash-object upstream/TurnCompletedNotification.json)" = "7db8c18c82325feee77876ed7172dae8125a4cd5"

      - name: Verify exact protocol source contract
        shell: python
        run: |
          from pathlib import Path

          thread = Path("upstream/thread_data.rs").read_text(encoding="utf-8")
          notification = Path("upstream/notification.rs").read_text(encoding="utf-8")

          required_thread = [
              'pub struct Turn {',
              'pub status: TurnStatus,',
              'pub error: Option<TurnError>,',
              'pub struct TurnError {',
              'pub message: String,',
              'pub codex_error_info: Option<CodexErrorInfo>,',
              'pub additional_details: Option<String>,',
              'pub misalignment: Option<MisalignmentErrorDetails>,',
          ]
          for token in required_thread:
              assert token in thread, token

          required_notification = [
              'pub struct ErrorNotification {',
              'pub error: TurnError,',
              'pub will_retry: bool,',
              'pub thread_id: String,',
              'pub turn_id: String,',
          ]
          for token in required_notification:
              assert token in notification, token

          print("P5A_CODEX_OQ1_SOURCE_PROTOCOL_COMPAT_PASS")

      - name: Verify exact JSON schema contract
        run: |
          python scripts/g2e/p5a_codex_observability.py             --verify-error-schema upstream/ErrorNotification.json             --verify-turn-completed-schema upstream/TurnCompletedNotification.json

      - name: Run P1-P4 regressions
        run: |
          pytest -q tests/g2e/test_p1_core_schemas.py
          pytest -q tests/g2e/test_p1_4_agent_binding.py
          pytest -q tests/g2e/test_p1_5_qualification_authority.py
          pytest -q tests/g2e/test_p2_deterministic_core.py
          pytest -q tests/g2e/test_p3_standalone_runtime.py
          pytest -q tests/g2e/test_p4_gwf_adapter.py

  observability-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: src

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: powershell
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Compile observability component
        shell: powershell
        run: |
          python -m compileall -q scripts\g2e\p5a_codex_observability.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run privacy and synthetic failed-turn qualification
        shell: powershell
        run: |
          pytest -q tests\g2e\test_p5a_codex_observability_qualification.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Emit zero-model qualification report
        shell: powershell
        run: |
          @'
          import json
          import subprocess
          from pathlib import Path

          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()

          report = {
              "schema": "G2E-P5A-CODEX-OBSERVABILITY-QUALIFICATION-v1",
              "candidate_sha": git("rev-parse", "HEAD"),
              "source_commit": "3d2ee51ca2d5db578f328aa75e20aa22c0197c9a",
              "observability_blob": git("rev-parse", "HEAD:scripts/g2e/p5a_codex_observability.py"),
              "test_blob": git("rev-parse", "HEAD:tests/g2e/test_p5a_codex_observability_qualification.py"),
              "workflow_blob": git("rev-parse", "HEAD:.github/workflows/g2e-p5a-codex-observability-qualification.yml"),
              "spec_blob": git("rev-parse", "HEAD:g2e/docs/P5A_CODEX_OBSERVABILITY_QUALIFICATION_SPEC.md"),
              "scope_amendment_blob": git("rev-parse", "HEAD:g2e/docs/P5A_CODEX_OBSERVABILITY_SCOPE_AMENDMENT.md"),
              "turn_error_message_preserved": True,
              "codex_error_info_preserved": True,
              "additional_details_preserved": True,
              "will_retry_preserved": True,
              "secret_redaction_tests": "PASS",
              "synthetic_failed_turn_tests": "PASS",
              "windows_python_tests": "PASS",
              "codex_started": False,
              "rpc_sent": False,
              "model_turn_executed": False,
              "p5_fx_001_executed": False,
              "successor_model_execution_authorized": False,
              "adjudication": "CODEX_TERMINAL_ERROR_OBSERVABILITY_QUALIFIED_PENDING_EXACT_LOCK",
          }
          Path("p5a-codex-observability-qualification.json").write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(report, indent=2, sort_keys=True))
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: g2e-p5a-codex-observability-qualification
          path: p5a-codex-observability-qualification.json
          if-no-files-found: error
