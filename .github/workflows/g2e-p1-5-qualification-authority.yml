name: G2E P1.5 Qualification Attempt Authority Gate

on:
  workflow_dispatch:
  push:
    branches: ["feature/g2e-framework"]
    paths:
      - "src/g2e/schemas.py"
      - "tests/g2e/test_p1_5_qualification_authority.py"
      - "g2e/docs/P1_5_QUALIFICATION_ATTEMPT_AUTHORITY_IMPLEMENTATION.md"
      - ".github/workflows/g2e-p1-5-qualification-authority.yml"

permissions:
  contents: read

jobs:
  p1-5-qualification-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: src
      P1_5_BASELINE_SHA: "53c7ac3d138968a2b96ece9ac58b95aef04511dc"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -U pip && pip install -e ".[dev]"

      - name: Verify bounded provider-neutral implementation diff
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$P1_5_BASELINE_SHA^{commit}"
          mapfile -t changed < <(git diff --name-only "$P1_5_BASELINE_SHA"...HEAD)
          printf '%s\n' "${changed[@]}"
          allowed=(
            ".github/workflows/g2e-p1-5-qualification-authority.yml"
            "g2e/docs/P1_5_QUALIFICATION_ATTEMPT_AUTHORITY_IMPLEMENTATION.md"
            "src/g2e/schemas.py"
            "tests/g2e/test_p1_5_qualification_authority.py"
          )
          for path in "${changed[@]}"; do
            ok=false
            for item in "${allowed[@]}"; do
              if [[ "$path" == "$item" ]]; then ok=true; break; fi
            done
            if [[ "$ok" != true ]]; then
              echo "Out-of-scope P1.5 mutation: $path" >&2
              exit 1
            fi
          done
          hits="$(find src/g2e src/gwr -type f \( -iname '*codex*' -o -iname '*chatgpt*' \) -print)"
          test -z "$hits"
          if git ls-files | grep -E '(^|/)P5A_D2_(EXECUTION_RESULT|ADJUDICATION|RESULT)\.json$'; then
            echo "D2 outcome evidence must not exist during P1.5" >&2
            exit 1
          fi

      - name: Compile G2E/GWF
        run: python -m compileall -q src/g2e src/gwr

      - name: Run P1 regression
        run: pytest -q tests/g2e/test_p1_core_schemas.py

      - name: Run P1.4 regression
        run: pytest -q tests/g2e/test_p1_4_agent_binding.py

      - name: Run P1.5 qualification
        run: pytest -q tests/g2e/test_p1_5_qualification_authority.py

      - name: Run P2 regression
        run: pytest -q tests/g2e/test_p2_deterministic_core.py

      - name: Run P3 regression
        run: pytest -q tests/g2e/test_p3_standalone_runtime.py

      - name: Run P4 regression
        run: pytest -q tests/g2e/test_p4_gwf_adapter.py

      - name: Assert qualification path remains explicit and provider neutral
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from g2e import AgentBinding, QualificationAuthorityGrant
          from g2e.schemas import validate_agent_binding_identity, validate_qualification_agent_binding_identity

          assert "qualification_authority_ref" in AgentBinding.model_fields
          assert "qualification_target_capability_ids" in AgentBinding.model_fields
          assert QualificationAuthorityGrant.schema_kind == "qualification_authority_grant"
          normal = Path(validate_agent_binding_identity.__code__.co_filename).read_text(encoding="utf-8")
          assert "def validate_agent_binding_identity" in normal
          assert callable(validate_qualification_agent_binding_identity)
          source = Path("src/g2e/schemas.py").read_text(encoding="utf-8").lower()
          assert "codex" not in source
          assert "chatgpt" not in source
          PY

      - name: Emit qualification report
        shell: bash
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path

          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()

          report = {
              "schema": "G2E-P1.5-QUALIFICATION-ATTEMPT-AUTHORITY-v1",
              "candidate_sha": git("rev-parse", "HEAD"),
              "baseline_sha": "53c7ac3d138968a2b96ece9ac58b95aef04511dc",
              "implementation_contract_blob": git("rev-parse", "HEAD:g2e/docs/P1_5_QUALIFICATION_ATTEMPT_AUTHORITY_IMPLEMENTATION.md"),
              "schema_blob": git("rev-parse", "HEAD:src/g2e/schemas.py"),
              "test_blob": git("rev-parse", "HEAD:tests/g2e/test_p1_5_qualification_authority.py"),
              "workflow_blob": git("rev-parse", "HEAD:.github/workflows/g2e-p1-5-qualification-authority.yml"),
              "p1_5": "PASS",
              "qualification_authority_grant": "QUALIFIED",
              "normal_p1_4_semantics_preserved": True,
              "model_turn_authorized": False,
              "d2_execution_authorized": False,
              "runtime_adapter_authorized": False,
              "next": "MATERIALIZE_P5_FX_001_GRANT_AND_FINAL_BINDING_THEN_ZERO_FRESH_ADMISSION",
          }
          Path("p1_5_qualification_authority_report.json").write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          print(json.dumps(report, indent=2, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: g2e-p1-5-qualification-authority
          path: p1_5_qualification_authority_report.json
          if-no-files-found: error
