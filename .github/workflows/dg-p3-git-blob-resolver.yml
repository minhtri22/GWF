name: DG-P3 Git Blob Resolver Gate

on:
  workflow_dispatch:
  push:
    branches: ["v0.8.6-dg-p3-git-blob-resolver"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  dg-p3-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python test dependencies
        run: python -m pip install -U pip && pip install -e ".[dev]"

      - name: DG-P3 unit and fixture tests
        run: python -m pytest -q tests/test_dg_p3_git_blob_resolver.py

      - name: Real GitHub exact-identity smoke
        run: >-
          python tools/run_dg_p3_gate.py
          --repository "${{ github.repository }}"
          --commit "${{ github.sha }}"
          --path "docs/DG_P3_GIT_BLOB_RESOLVER_SPEC.md"
          --expected-repository-id "1374857546"
          --out evidence/dg-p3/DG_P3_GATE.json

      - name: Assert P3 gate
        run: |
          python - <<'PY'
          import json
          d=json.load(open('evidence/dg-p3/DG_P3_GATE.json', encoding='utf-8'))
          assert d['status']=='PASS', d
          assert d['checks']['provider_repository_identity'] is True, d
          assert d['checks']['exact_commit_bound'] is True, d
          assert d['checks']['exact_blob_bound'] is True, d
          assert d['checks']['independent_content_sha256'] is True, d
          assert d['checks']['raw_content_not_normalized'] is True, d
          assert d['checks']['read_only_write_denied'] is True, d
          assert d['checks']['deterministic_exact_resolution'] is True, d
          assert d['checks']['credential_material_absent'] is True, d
          PY

      - name: Bounded regression
        run: >-
          python -m pytest -q
          tests/test_v084_github_plugin_sha_qa.py
          tests/test_document_validation_p0.py
          tests/test_document_validation_p1.py
          tests/test_document_validation_p2.py
          tests/test_v085_domain_skills.py

      - name: Compile
        run: python -m compileall -q src tests tools

      - name: Upload DG-P3 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gwr-dg-p3-evidence
          path: evidence/dg-p3/DG_P3_GATE.json
