name: DG-P10 Change Classification

on:
  workflow_dispatch:
  push:
    branches: ["v0.8.6-dg-p10-change-classification-implementation"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  sqlite:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install
        run: python -m pip install -U pip && pip install -e ".[dev,postgres]"
      - name: D10-F1..D10-F20
        run: python -m pytest -q tests/test_dg_p10_change_classification.py
      - name: Bounded DG-P10 gate
        run: python tools/run_dg_p10_gate.py --out evidence/dg-p10/sqlite.json
      - name: Targeted regressions
        run: python -m pytest -q tests/test_dg_p4_document_facade.py tests/test_dg_p5_qa_findings.py tests/test_dg_p7_authority.py tests/test_dg_p8_relations.py tests/test_dg_p9_relations.py tests/test_v082_project_governance_agent_protocol.py
      - name: Full regression
        run: python -m pytest -q
      - name: Compile
        run: python -m compileall -q src tests tools
      - name: Upload SQLite evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gwr-dg-p10-sqlite-evidence
          path: evidence/dg-p10/sqlite.json

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: gwr
          POSTGRES_PASSWORD: gwr_test_password
          POSTGRES_DB: gwr_gate
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gwr -d gwr_gate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PYTHONPATH: src
      GWR_TEST_DATABASE_URL: postgresql://gwr:gwr_test_password@127.0.0.1:5432/gwr_gate
      GWR_TEST_NAMESPACE_PREFIX: dg_p10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install
        run: python -m pip install -U pip && pip install -e ".[dev,postgres]"
      - name: D10 PostgreSQL 17
        run: python -m pytest -q tests/test_dg_p10_change_classification.py
      - name: Bounded PostgreSQL gate
        run: python tools/run_dg_p10_gate.py --out evidence/dg-p10/postgres.json
      - name: Upload PostgreSQL evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gwr-dg-p10-postgres-evidence
          path: evidence/dg-p10/postgres.json

  windows-oneclick-uat:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Parse one-click installer
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path '.\install.ps1'),[ref]$null,[ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | Format-List | Out-String | Write-Error; exit 1 }
      - name: One-click local UAT setup
        shell: pwsh
        run: .\install.ps1 -InstallPythonIfMissing:$false -SkipPostgres
      - name: Assert UAT report
        shell: pwsh
        run: |
          $r = Get-Content '.\.gwr\install\install-report.json' -Raw | ConvertFrom-Json
          if ($r.status -ne 'PASS') { throw "installer status=$($r.status)" }
          if ($r.dg_p10.status -ne 'PASS') { throw "DG-P10 gate=$($r.dg_p10.status)" }
          if (-not (Test-Path '.\.gwr\uat\docs\gov\archive')) { throw 'missing gov archive UAT folder' }
          if (-not (Test-Path '.\.gwr\uat\docs\phase1\archive')) { throw 'missing phase archive UAT folder' }
      - name: Upload install/UAT evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gwr-dg-p10-windows-uat
          path: |
            .gwr/install/install-report.json
            .gwr/install/dg-p10-gate.json
            .gwr/uat/UAT.md
