name: G2E P2 Deterministic Core Gate

on:
  workflow_dispatch:
  push:
    branches: ["feature/g2e-framework"]
    paths:
      - "src/g2e/**"
      - "tests/g2e/**"
      - ".github/workflows/g2e-p2-deterministic-core.yml"
      - "g2e/docs/P2_*"
      - "g2e/LINEAGE.md"

permissions:
  contents: read

jobs:
  p2-deterministic-core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install GWF/G2E test dependencies
        run: python -m pip install -U pip && pip install -e ".[dev]"
      - name: Compile G2E package
        run: python -m compileall -q src/g2e
      - name: Run frozen P1 regression
        run: pytest -q tests/g2e/test_p1_core_schemas.py
      - name: Run P2 deterministic core gate
        run: pytest -q tests/g2e/test_p2_deterministic_core.py
      - name: Assert forbidden runtime dependencies absent
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/g2e/engine.py').read_text(encoding='utf-8')
          forbidden=('sqlite3','sqlalchemy','requests','httpx','fastapi','src.gwr','from gwr','import gwr')
          hits=[x for x in forbidden if x in p]
          assert not hits, hits
          PY
