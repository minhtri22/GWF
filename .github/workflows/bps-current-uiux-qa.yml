name: BPS Current UI UX Regression

on:
  workflow_dispatch:
  push:
    branches: ["feature/bps-i00-product-shell"]
    paths:
      - "src/gwr/**"
      - "web/**"
      - "tests/test_bps_*.py"
      - "docs/uiux/**"
      - "docs/BPS_*.md"
      - "docs/BROWSER_PRODUCT_SURFACE_SPEC.md"
      - "docs/UI_UX_*.md"
      - ".github/workflows/bps-current-uiux-qa.yml"

permissions:
  contents: read

jobs:
  bps-uiux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -U pip && pip install -e ".[dev]"
      - name: JavaScript syntax check
        run: node --check web/app.js
      - name: Run Browser Product Surface regression
        run: python -m pytest -q tests/test_bps_*.py
