name: G2E P5A.1R Inventory Ordering Repair

on:
  workflow_dispatch:
  push:
    branches: ["feature/g2e-framework"]
    paths:
      - "g2e/docs/P5A_D1_INVENTORY_ORDERING_INVALIDITY_REPAIR.md"
      - "scripts/g2e/p5a_adjudicate_d1.py"
      - "tests/g2e/test_p5a_d1_inventory_ordering_repair.py"
      - ".github/workflows/g2e-p5a-d1-inventory-ordering-repair.yml"

permissions:
  contents: read

jobs:
  p5a-d1-inventory-ordering-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: src
      REPAIR_BASELINE_SHA: "e8702669df8d8f834818e6f00ad0c8dd1bf8ba17"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -U pip && pip install -e ".[dev]"

      - name: Verify bounded invalidity-repair diff
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$REPAIR_BASELINE_SHA^{commit}"
          mapfile -t changed < <(git diff --name-only "$REPAIR_BASELINE_SHA"...HEAD)
          printf '%s\n' "${changed[@]}"
          allowed=(
            ".github/workflows/g2e-p5a-d1-inventory-ordering-repair.yml"
            "g2e/docs/P5A_D1_INVENTORY_ORDERING_INVALIDITY_REPAIR.md"
            "scripts/g2e/p5a_adjudicate_d1.py"
            "tests/g2e/test_p5a_d1_inventory_ordering_repair.py"
          )
          for path in "${changed[@]}"; do
            ok=false
            for item in "${allowed[@]}"; do
              if [[ "$path" == "$item" ]]; then ok=true; break; fi
            done
            if [[ "$ok" != true ]]; then
              echo "Out-of-scope P5A.1R mutation: $path" >&2
              exit 1
            fi
          done
          if git diff --name-only "$REPAIR_BASELINE_SHA"...HEAD | grep -E '^(src/g2e|src/gwr|scripts/g2e/p5a_codex_discovery\.py|scripts/g2e/p5a_codex_discovery\.ps1)$'; then
            echo "P5A.1R must not mutate runtime/core/discovery probe" >&2
            exit 1
          fi

      - name: Compile
        run: python -m compileall -q src/g2e src/gwr scripts/g2e/p5a_adjudicate_d1.py

      - name: Run P1 regression
        run: pytest -q tests/g2e/test_p1_core_schemas.py

      - name: Run P1.4 regression
        run: pytest -q tests/g2e/test_p1_4_agent_binding.py

      - name: Run P2 regression
        run: pytest -q tests/g2e/test_p2_deterministic_core.py

      - name: Run P3 regression
        run: pytest -q tests/g2e/test_p3_standalone_runtime.py

      - name: Run P4 regression
        run: pytest -q tests/g2e/test_p4_gwf_adapter.py

      - name: Run P5A preparation regression
        run: pytest -q tests/g2e/test_p5a_codex_discovery_preparation.py

      - name: Run parent P5A.1 adjudicator regression
        run: pytest -q tests/g2e/test_p5a_d1_adjudication_lock.py

      - name: Run P5A.1R repair qualification
        run: pytest -q tests/g2e/test_p5a_d1_inventory_ordering_repair.py

      - name: Assert repair has no execution path
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          source = Path("scripts/g2e/p5a_adjudicate_d1.py").read_text(encoding="utf-8")
          forbidden = (
              "subprocess",
              "ProofObligation",
              "ExecutionAttemptEnvelope",
              "AgentBinding",
              "Popen(",
              "os.system",
              "shutil.which",
          )
          hits = [token for token in forbidden if token in source]
          assert not hits, hits
          PY

      - name: Emit repair report
        shell: bash
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path

          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()

          report = {
              "schema": "G2E-P5A-D1-INVENTORY-ORDERING-REPAIR-v1",
              "candidate_sha": git("rev-parse", "HEAD"),
              "baseline_sha": "e8702669df8d8f834818e6f00ad0c8dd1bf8ba17",
              "repair_spec_blob": git("rev-parse", "HEAD:g2e/docs/P5A_D1_INVENTORY_ORDERING_INVALIDITY_REPAIR.md"),
              "adjudicator_blob": git("rev-parse", "HEAD:scripts/g2e/p5a_adjudicate_d1.py"),
              "repair_test_blob": git("rev-parse", "HEAD:tests/g2e/test_p5a_d1_inventory_ordering_repair.py"),
              "workflow_blob": git("rev-parse", "HEAD:.github/workflows/g2e-p5a-d1-inventory-ordering-repair.yml"),
              "original_discovery_sha256": "ba098a56be39e996488e5a543af8c373199f8b4cc66f922be6d7bc6386c6e860",
              "invalidity_reason": "INVENTORY_PATHS_NOT_SORTED",
              "fresh_codex_recollection_authorized": False,
              "repair_scope": "PLATFORM_PATH_ORDER_VALIDATION_ONLY",
              "d2_authorized": False,
              "runtime_adapter_authorized": False,
          }
          Path("p5a_d1_inventory_ordering_repair_report.json").write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(report, indent=2, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: g2e-p5a-d1-inventory-ordering-repair
          path: p5a_d1_inventory_ordering_repair_report.json
          if-no-files-found: error
