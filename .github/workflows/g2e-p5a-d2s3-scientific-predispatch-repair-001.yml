name: G2E P5A D2-S3 Scientific Predispatch Repair 001 Gate

on:
  workflow_dispatch:
  push:
    branches: ["feature/g2e-framework"]
    paths:
      - "g2e/docs/P5A_D2S3_SCIENCE001_PREDISPATCH_ADJUDICATION.md"
      - "g2e/docs/P5A_D2S3_SCIENTIFIC_PREDISPATCH_REPAIR_001_SPEC.md"
      - "scripts/g2e/p5a_d2s3_scientific_runner.py"
      - "scripts/g2e/p5a_d2s3_scientific_oneclick.ps1"
      - "tests/g2e/test_p5a_d2s3_scientific_macro.py"
      - "tests/g2e/test_p5a_d2s3_scientific_predispatch_repair_001.py"
      - ".github/workflows/g2e-p5a-d2s3-scientific-predispatch-repair-001.yml"

permissions:
  contents: read

jobs:
  repair-static:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONPATH: src
      BASELINE_SHA: "d8cdb36b28c891e3fc262b24207791d24cd7679a"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -U pip && pip install -e ".[dev]"

      - name: Verify bounded repair diff
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$BASELINE_SHA^{commit}"
          mapfile -t changed < <(git diff --name-only "$BASELINE_SHA"...HEAD)
          printf '%s\n' "${changed[@]}"
          allowed=(
            ".github/workflows/g2e-p5a-d2s3-scientific-predispatch-repair-001.yml"
            "g2e/docs/P5A_D2S3_SCIENCE001_PREDISPATCH_ADJUDICATION.md"
            "g2e/docs/P5A_D2S3_SCIENTIFIC_PREDISPATCH_REPAIR_001_SPEC.md"
            "scripts/g2e/p5a_d2s3_scientific_runner.py"
            "scripts/g2e/p5a_d2s3_scientific_oneclick.ps1"
            "tests/g2e/test_p5a_d2s3_scientific_macro.py"
            "tests/g2e/test_p5a_d2s3_scientific_predispatch_repair_001.py"
          )
          for path in "${changed[@]}"; do
            ok=false
            for item in "${allowed[@]}"; do
              if [[ "$path" == "$item" ]]; then ok=true; break; fi
            done
            if [[ "$ok" != true ]]; then
              echo "Out-of-scope D2-S3 predispatch repair mutation: $path" >&2
              exit 1
            fi
          done

      - name: Verify frozen scientific components unchanged
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:scripts/g2e/p5a_d2s3_scientific_admission.py)" = "311b086c4fe5061a2c4ab18a5252e1b560840782"
          test "$(git rev-parse HEAD:scripts/g2e/p5a_d2s3_scientific_verify.py)" = "8d92d4aac7b6c7449ede36c764650223648bd5b4"
          test "$(git rev-parse HEAD:scripts/g2e/p5a_d2s3_platform_no_turn_preflight.py)" = "ecd0af7cd487e14ea1691f4195af1d147efd0fe4"

      - name: Compile Python components
        run: |
          python -m compileall -q             scripts/g2e/p5a_d2s3_scientific_runner.py             scripts/g2e/p5a_d2s3_scientific_verify.py             scripts/g2e/p5a_d2s3_scientific_admission.py

      - name: Parse scientific one-click
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "scripts/g2e/p5a_d2s3_scientific_oneclick.ps1",
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -ne 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

      - name: Run predispatch repair qualification
        run: pytest -q tests/g2e/test_p5a_d2s3_scientific_predispatch_repair_001.py

      - name: Run scientific macro semantic regression
        run: pytest -q tests/g2e/test_p5a_d2s3_scientific_macro.py

      - name: Run inherited D2-S3 no-turn regressions
        run: |
          pytest -q tests/g2e/test_p5a_d2s3_platform_no_turn_preflight.py
          pytest -q tests/g2e/test_p5a_d2s3_ntfs_root_closure_repair_002.py

      - name: Run P1 regression
        run: pytest -q tests/g2e/test_p1_core_schemas.py

      - name: Run P1.4 regression
        run: pytest -q tests/g2e/test_p1_4_agent_binding.py

      - name: Run P1.5 regression
        run: pytest -q tests/g2e/test_p1_5_qualification_authority.py

      - name: Run P2 regression
        run: pytest -q tests/g2e/test_p2_deterministic_core.py

      - name: Run P3 regression
        run: pytest -q tests/g2e/test_p3_standalone_runtime.py

      - name: Run P4 regression
        run: pytest -q tests/g2e/test_p4_gwf_adapter.py

  repair-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: powershell
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Parse with Windows PowerShell 5.1
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "scripts\g2e\p5a_d2s3_scientific_oneclick.ps1",
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -ne 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

      - name: Execute infrastructure and native-capture self-test
        shell: powershell
        run: |
          & ".\scripts\g2e\p5a_d2s3_scientific_oneclick.ps1" -InfrastructureSelfTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run repair qualification on Windows
        shell: powershell
        run: |
          pytest -q tests\g2e\test_p5a_d2s3_scientific_predispatch_repair_001.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Emit repair qualification report
        shell: powershell
        run: |
          @'
          import json
          import subprocess
          from pathlib import Path

          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()

          report = {
              "schema": "G2E-P5A-D2S3-SCIENTIFIC-PREDISPATCH-REPAIR-001-QUALIFICATION-v1",
              "candidate_sha": git("rev-parse", "HEAD"),
              "baseline_sha": "d8cdb36b28c891e3fc262b24207791d24cd7679a",
              "bound_science001_report_sha256": "5da2db218c2b14856a5f07262cc840a63288fb81c490160ea83d0175d4cbca87",
              "runner_blob": git("rev-parse", "HEAD:scripts/g2e/p5a_d2s3_scientific_runner.py"),
              "oneclick_blob": git("rev-parse", "HEAD:scripts/g2e/p5a_d2s3_scientific_oneclick.ps1"),
              "verifier_blob": git("rev-parse", "HEAD:scripts/g2e/p5a_d2s3_scientific_verify.py"),
              "admission_blob": git("rev-parse", "HEAD:scripts/g2e/p5a_d2s3_scientific_admission.py"),
              "preflight_blob": git("rev-parse", "HEAD:scripts/g2e/p5a_d2s3_platform_no_turn_preflight.py"),
              "macro_test_blob": git("rev-parse", "HEAD:tests/g2e/test_p5a_d2s3_scientific_macro.py"),
              "repair_test_blob": git("rev-parse", "HEAD:tests/g2e/test_p5a_d2s3_scientific_predispatch_repair_001.py"),
              "workflow_blob": git("rev-parse", "HEAD:.github/workflows/g2e-p5a-d2s3-scientific-predispatch-repair-001.yml"),
              "spec_blob": git("rev-parse", "HEAD:g2e/docs/P5A_D2S3_SCIENTIFIC_PREDISPATCH_REPAIR_001_SPEC.md"),
              "adjudication_blob": git("rev-parse", "HEAD:g2e/docs/P5A_D2S3_SCIENCE001_PREDISPATCH_ADJUDICATION.md"),
              "execution_config_hash": "df5308888eac7fa0b876f2cd68a51d0f2dd80a1b7c6d556cb04c854067b86e81",
              "r2_report_sha256": "b24af8e5261ba8e5a90605e7a9b9d63c0025f37650f9a4e657cdaafd76b0545e",
              "r2_evidence_sha256": "87f18cf15f06eb1bc3e0a9e28f76e3208b2c082c3cd458221242d65db7b8cc28",
              "old_macro_qualification_run_id": 35716716455,
              "scientific_attempt_consumed": False,
              "model_turn_executed": False,
              "retry_authorized": False,
              "replacement_root": "g2e/.local/P5A-D2S3-SCIENCE-002",
              "adjudication": "D2S3_SCIENTIFIC_PREDISPATCH_REPAIR_PASS_ONE_SCIENCE002_INVOCATION_AUTHORIZED",
          }
          Path("d2s3-scientific-predispatch-repair-001-qualification.json").write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(report, indent=2, sort_keys=True))
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: g2e-p5a-d2s3-scientific-predispatch-repair-001-qualification
          path: d2s3-scientific-predispatch-repair-001-qualification.json
          if-no-files-found: error
