name: G2E P5A Codex Discovery Preparation

on:
  workflow_dispatch:
  push:
    branches: ["feature/g2e-framework"]
    paths:
      - "g2e/docs/P5A_CODEX_DISCOVERY_PREPARATION.md"
      - "scripts/g2e/p5a_codex_discovery.py"
      - "scripts/g2e/p5a_codex_discovery.ps1"
      - "tests/g2e/test_p5a_codex_discovery_preparation.py"
      - ".github/workflows/g2e-p5a-codex-discovery-preparation.yml"

permissions:
  contents: read

jobs:
  p5a-codex-discovery-preparation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: src
      P5A_BASELINE_SHA: "27ad96d384919101285208fe36bf27c76f36bb52"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -U pip && pip install -e ".[dev]"

      - name: Verify P5A preparation-only diff
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$P5A_BASELINE_SHA^{commit}"
          mapfile -t changed < <(git diff --name-only "$P5A_BASELINE_SHA"...HEAD)
          printf '%s\n' "${changed[@]}"
          allowed=(
            ".github/workflows/g2e-p5a-codex-discovery-preparation.yml"
            "g2e/docs/P5A_CODEX_DISCOVERY_PREPARATION.md"
            "scripts/g2e/p5a_codex_discovery.py"
            "scripts/g2e/p5a_codex_discovery.ps1"
            "tests/g2e/test_p5a_codex_discovery_preparation.py"
          )
          for path in "${changed[@]}"; do
            ok=false
            for item in "${allowed[@]}"; do
              if [[ "$path" == "$item" ]]; then ok=true; break; fi
            done
            if [[ "$ok" != true ]]; then
              echo "Out-of-scope P5A preparation mutation: $path" >&2
              exit 1
            fi
          done
          if git diff --name-only "$P5A_BASELINE_SHA"...HEAD | grep -E '^(src/g2e|src/gwr)/'; then
            echo "P5A preparation must not mutate runtime/core implementation" >&2
            exit 1
          fi

      - name: Compile existing G2E/GWF and discovery probe
        run: python -m compileall -q src/g2e src/gwr scripts/g2e/p5a_codex_discovery.py

      - name: Run P1 regression
        run: pytest -q tests/g2e/test_p1_core_schemas.py

      - name: Run P1.4 regression
        run: pytest -q tests/g2e/test_p1_4_agent_binding.py

      - name: Run P2 regression
        run: pytest -q tests/g2e/test_p2_deterministic_core.py

      - name: Run P3 regression
        run: pytest -q tests/g2e/test_p3_standalone_runtime.py

      - name: Run P4 regression
        run: pytest -q tests/g2e/test_p4_gwf_adapter.py

      - name: Run P5A discovery preparation qualification
        run: pytest -q tests/g2e/test_p5a_codex_discovery_preparation.py

      - name: Assert no runtime adapter or provider execution path
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          probe = Path("scripts/g2e/p5a_codex_discovery.py").read_text(encoding="utf-8")
          forbidden = (
              "ProofObligation",
              "ExecutionAttemptEnvelope",
              "AgentBinding",
              '"method": "thread/start"',
              "'method': 'thread/start'",
              "codex exec",
          )
          hits = [token for token in forbidden if token in probe]
          assert not hits, hits

          runtime_hits = []
          for root in (Path("src/g2e"), Path("src/gwr")):
              for path in root.rglob("*"):
                  if path.is_file() and ("codex" in path.name.lower() or "chatgpt" in path.name.lower()):
                      runtime_hits.append(str(path))
          assert not runtime_hits, runtime_hits
          PY

      - name: Emit preparation report
        shell: bash
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path

          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()

          report = {
              "schema": "G2E-P5A-CODEX-DISCOVERY-PREPARATION-v1",
              "candidate_sha": git("rev-parse", "HEAD"),
              "baseline_sha": "27ad96d384919101285208fe36bf27c76f36bb52",
              "spec_blob": git("rev-parse", "HEAD:g2e/docs/P5A_CODEX_DISCOVERY_PREPARATION.md"),
              "probe_blob": git("rev-parse", "HEAD:scripts/g2e/p5a_codex_discovery.py"),
              "powershell_blob": git("rev-parse", "HEAD:scripts/g2e/p5a_codex_discovery.ps1"),
              "test_blob": git("rev-parse", "HEAD:tests/g2e/test_p5a_codex_discovery_preparation.py"),
              "workflow_blob": git("rev-parse", "HEAD:.github/workflows/g2e-p5a-codex-discovery-preparation.yml"),
              "preparation": "PASS",
              "adjudication": "PREPARATION_PASS_ACTUAL_HARNESS_PENDING",
              "codex_profile_available": False,
              "runtime_adapter_authorized": False,
              "functional_task_executed": False,
          }
          Path("p5a_codex_discovery_preparation_report.json").write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(report, indent=2, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: g2e-p5a-codex-discovery-preparation
          path: p5a_codex_discovery_preparation_report.json
          if-no-files-found: error
