name: G2E P5A D2-S2 A2 Binary Component Lineage Gate

on:
  workflow_dispatch:
  push:
    branches: ["feature/g2e-framework"]
    paths:
      - "scripts/g2e/p5a_d2s2_a2_binary_component_lineage.ps1"
      - "tests/g2e/test_p5a_d2s2_a2_binary_component_lineage.py"
      - ".github/workflows/g2e-p5a-d2s2-a2-binary-component-lineage.yml"

permissions:
  contents: read

jobs:
  a2-lineage-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: src
      BASELINE_SHA: "eb74f25f40c78606e430fefddd1a328a513d0497"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -U pip && pip install -e ".[dev]"

      - name: Verify bounded lineage diff
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$BASELINE_SHA^{commit}"
          mapfile -t changed < <(git diff --name-only "$BASELINE_SHA"...HEAD)
          printf '%s\n' "${changed[@]}"
          allowed=(
            ".github/workflows/g2e-p5a-d2s2-a2-binary-component-lineage.yml"
            "scripts/g2e/p5a_d2s2_a2_binary_component_lineage.ps1"
            "tests/g2e/test_p5a_d2s2_a2_binary_component_lineage.py"
          )
          for path in "${changed[@]}"; do
            ok=false
            for item in "${allowed[@]}"; do
              if [[ "$path" == "$item" ]]; then ok=true; break; fi
            done
            if [[ "$ok" != true ]]; then
              echo "Out-of-scope A2 lineage mutation: $path" >&2
              exit 1
            fi
          done

      - name: Parse PowerShell collector
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "scripts/g2e/p5a_d2s2_a2_binary_component_lineage.ps1",
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -ne 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

      - name: Run lineage qualification
        run: pytest -q tests/g2e/test_p5a_d2s2_a2_binary_component_lineage.py

      - name: Run P1 regression
        run: pytest -q tests/g2e/test_p1_core_schemas.py

      - name: Run P1.4 regression
        run: pytest -q tests/g2e/test_p1_4_agent_binding.py

      - name: Run P1.5 regression
        run: pytest -q tests/g2e/test_p1_5_qualification_authority.py

      - name: Run P2 regression
        run: pytest -q tests/g2e/test_p2_deterministic_core.py

      - name: Run P3 regression
        run: pytest -q tests/g2e/test_p3_standalone_runtime.py

      - name: Run P4 regression
        run: pytest -q tests/g2e/test_p4_gwf_adapter.py

      - name: Emit lineage qualification report
        shell: bash
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path

          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()

          report = {
              "schema": "G2E-P5A-D2S2-A2-BINARY-COMPONENT-LINEAGE-QUALIFICATION-v1",
              "baseline_sha": "eb74f25f40c78606e430fefddd1a328a513d0497",
              "candidate_sha": git("rev-parse", "HEAD"),
              "collector_blob": git("rev-parse", "HEAD:scripts/g2e/p5a_d2s2_a2_binary_component_lineage.ps1"),
              "test_blob": git("rev-parse", "HEAD:tests/g2e/test_p5a_d2s2_a2_binary_component_lineage.py"),
              "workflow_blob": git("rev-parse", "HEAD:.github/workflows/g2e-p5a-d2s2-a2-binary-component-lineage.yml"),
              "spec_blob": git("rev-parse", "HEAD:g2e/docs/P5A_D2S2_A2_BINARY_COMPONENT_LINEAGE_SPEC.md"),
              "adjudication_blob": git("rev-parse", "HEAD:g2e/docs/P5A_D2S2_A2_SANDBOX_STATE_MECHANISM_ADJUDICATION.md"),
              "expected_codex_sha256": "a337b7433ebb351c0165dd074cf2500a20fca9ceab3680a71df593653bf70dc8",
              "adjudication": "BINARY_LINEAGE_PASS_WINDOWS_RESOLVER_REQUIRED",
              "scientific_attempt_authorized": False,
              "scientific_attempt_consumed": False,
              "model_turn_executed": False,
          }
          Path("p5a_d2s2_a2_binary_lineage_qualification.json").write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(report, indent=2, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: g2e-p5a-d2s2-a2-binary-lineage-qualification
          path: p5a_d2s2_a2_binary_lineage_qualification.json
          if-no-files-found: error

  a2-lineage-windows:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Parse collector with Windows PowerShell
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "scripts\g2e\p5a_d2s2_a2_binary_component_lineage.ps1",
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -ne 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

      - name: Execute frozen resolver priority self-test
        shell: powershell
        run: |
          & ".\scripts\g2e\p5a_d2s2_a2_binary_component_lineage.ps1" -ResolverSelfTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
