name: G2E P5A-CGW FX001 TC2 lock-candidate QA

on:
  push:
    branches:
      - research/p5a-cgw-fx001-transport-corrected
    paths:
      - "g2e/docs/P5A_CGW_FX001_TC2_EXECUTION_LOCK_CANDIDATE.json"
      - "g2e/docs/P5A_CGW_FX001_TC2_LOCAL_PREFLIGHT_RESULT.json"
      - "g2e/docs/P5A_CGW_FX001_TC2_IMPLEMENTATION_QUALIFICATION_RESULT.json"
      - "scripts/g2e/p5a_cgw_fx001_tc2_oneclick.ps1"
      - "tests/g2e/test_p5a_cgw_fx001_tc2_lock_candidate.py"
      - ".github/workflows/g2e-p5a-cgw-fx001-tc2-lock-candidate-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zero-model:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install pytest PyYAML
      - name: TC2 lock-candidate regressions
        run: python -m pytest -q tests/g2e/test_p5a_cgw_fx001_tc2_lock_candidate.py

  powershell-parser:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Windows PowerShell 5.1 parser
        shell: powershell
        run: |
          $Errors = $null
          $Tokens = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path ".\scripts\g2e\p5a_cgw_fx001_tc2_oneclick.ps1"),
            [ref]$Tokens,
            [ref]$Errors
          )
          if ($Errors.Count -ne 0) {
            $Errors | Format-List *
            throw "POWERSHELL_PARSE_FAILED"
          }
          Write-Host "POWERSHELL_51_PARSE_PASS"
