name: DG-W2 Wave 2 Requalification Gate\n\non:\n  workflow_dispatch:\n  push:\n    branches: ["v0.8.6-dg-w2-wave2-exit-gate"]\n  pull_request:\n    branches: ["main"]\n\npermissions:\n  contents: read\n\njobs:\n  dg-w2-linux:\n    runs-on: ubuntu-latest\n    timeout-minutes: 60\n    env:\n      GITHUB_TOKEN: ${{ github.token }}\n    steps:\n      - uses: actions/checkout@v4\n        with:\n          fetch-depth: 0\n\n      - uses: actions/setup-python@v5\n        with:\n          python-version: "3.12"\n\n      - name: Install Python dependencies\n        run: python -m pip install -U pip && pip install -e ".[dev]"\n\n      - name: Requalify D4 D5 D6 fixture matrices on one HEAD\n        run: >-\n          python -m pytest -q\n          tests/test_dg_p4_document_facade.py\n          tests/test_dg_p5_qa_findings.py\n          tests/test_dg_p6_lifecycle_validity.py\n\n      - name: Re-run real DG-P4 gate on Wave 2 HEAD\n        run: >-\n          python tools/run_dg_p4_gate.py\n          --repository "${{ github.repository }}"\n          --commit "${{ github.sha }}"\n          --path "docs/DG_P4_DOCUMENT_FACADE_SPEC.md"\n          --expected-repository-id "1374857546"\n          --out evidence/dg-w2/p4.json\n\n      - name: Re-run DG-P5 gate on Wave 2 HEAD\n        run: python tools/run_dg_p5_gate.py --out evidence/dg-w2/p5.json\n\n      - name: Re-run DG-P6 gate on Wave 2 HEAD\n        run: python tools/run_dg_p6_gate.py --out evidence/dg-w2/p6.json\n\n      - name: Cross-wave P4-P6 integration gate\n        run: >-\n          python tools/run_dg_w2_gate.py\n          --commit "${{ github.sha }}"\n          --p4 evidence/dg-w2/p4.json\n          --p5 evidence/dg-w2/p5.json\n          --p6 evidence/dg-w2/p6.json\n          --out evidence/dg-w2/DG_W2_QA.json\n\n      - name: Assert DG-W2\n        run: |\n          python - <<'PY'\n          import json\n          d=json.load(open('evidence/dg-w2/DG_W2_QA.json', encoding='utf-8'))\n          assert d['status']=='PASS', d\n          assert all(v=='PASS' for v in d['component_status'].values()), d\n          assert all(d['checks'].values()), d\n          assert d['schema_state']['unexpected_parallel_tables']==[], d\n          PY\n\n      - name: Knowledge Execution Decision P4 P5 P6 regressions\n        run: >-\n          python -m pytest -q\n          tests/test_knowledge.py\n          tests/test_execution_decision.py\n          tests/test_persistence.py\n          tests/test_dg_p4_document_facade.py\n          tests/test_dg_p5_qa_findings.py\n          tests/test_dg_p6_lifecycle_validity.py\n\n      - name: Full regression\n        run: python -m pytest -q\n\n      - name: Compile\n        run: python -m compileall -q src tests tools\n\n      - name: Upload DG-W2 evidence\n        if: always()\n        uses: actions/upload-artifact@v4\n        with:\n          name: gwr-dg-w2-wave2-qa\n          path: evidence/dg-w2\n