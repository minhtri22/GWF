name: G2E P5A-CGW Zero-Model Qualification

on:
  workflow_dispatch:
  push:
    branches: ["research/p5a-cgw-specification"]
    paths:
      - "scripts/g2e/p5a_cgw_bridge_qualification.py"
      - "scripts/g2e/p5a_cgw_local_zero_model_oneclick.ps1"
      - "tests/g2e/test_p5a_cgw_zero_model_qualification.py"
      - "g2e/docs/P5A_CGW_*"
      - "g2e/LINEAGE.md"
      - ".github/workflows/g2e-p5a-cgw-zero-model-qualification.yml"

permissions:
  contents: read

jobs:
  synthetic-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONPATH: src
      SPEC_BASE: "4124c9084899b6ef3be3649f1700f62ab082ea0e"
      CGW_COMMIT: "eaf4f09ae92d4dc4429fa597b0861663138f08f8"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install G2E dependencies
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"

      - name: Verify bounded implementation diff
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$SPEC_BASE^{commit}"
          mapfile -t changed < <(git diff --name-only "$SPEC_BASE"...HEAD)
          printf '%s\n' "${changed[@]}"
          allowed=(
            ".github/workflows/g2e-p5a-cgw-zero-model-qualification.yml"
            "scripts/g2e/p5a_cgw_bridge_qualification.py"
            "scripts/g2e/p5a_cgw_local_zero_model_oneclick.ps1"
            "tests/g2e/test_p5a_cgw_zero_model_qualification.py"
            "g2e/docs/P5A_CGW_IMPLEMENTATION_QUALIFICATION_RESULT.md"
            "g2e/docs/P5A_CGW_IMPLEMENTATION_QUALIFICATION_LOCK.json"
            "g2e/LINEAGE.md"
          )
          for path in "${changed[@]}"; do
            ok=false
            for item in "${allowed[@]}"; do
              if [[ "$path" == "$item" ]]; then ok=true; break; fi
            done
            if [[ "$ok" != true ]]; then
              echo "Out-of-scope P5A-CGW mutation: $path" >&2
              exit 1
            fi
          done

      - name: Fetch exact upstream CGW source
        shell: bash
        run: |
          set -euo pipefail
          git init cgw-upstream
          git -C cgw-upstream remote add origin https://github.com/miuuyy/codex-chatgpt-web.git
          git -C cgw-upstream fetch --depth=1 origin "$CGW_COMMIT"
          git -C cgw-upstream checkout --detach FETCH_HEAD
          test "$(git -C cgw-upstream rev-parse HEAD)" = "$CGW_COMMIT"

      - name: Compile implementation
        run: python -m compileall -q scripts/g2e/p5a_cgw_bridge_qualification.py

      - name: Parse Windows one-click
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "scripts/g2e/p5a_cgw_local_zero_model_oneclick.ps1",
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -ne 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

      - name: Run P5A-CGW synthetic qualification
        run: |
          pytest -q tests/g2e/test_p5a_cgw_zero_model_qualification.py
          python scripts/g2e/p5a_cgw_bridge_qualification.py \
            --synthetic-output p5a-cgw-synthetic-qualification.json \
            --upstream-root cgw-upstream

      - name: Run G2E P1-P4 authority/evidence regressions
        run: |
          pytest -q tests/g2e/test_p1_core_schemas.py
          pytest -q tests/g2e/test_p1_4_agent_binding.py
          pytest -q tests/g2e/test_p1_5_qualification_authority.py
          pytest -q tests/g2e/test_p2_deterministic_core.py
          pytest -q tests/g2e/test_p3_standalone_runtime.py
          pytest -q tests/g2e/test_p4_gwf_adapter.py

      - name: Finalize synthetic report
        shell: python
        run: |
          import json, subprocess
          from pathlib import Path

          p = Path("p5a-cgw-synthetic-qualification.json")
          report = json.loads(p.read_text(encoding="utf-8"))
          report["gates"]["Q8_g2e_regression"] = {
              "pass": True,
              "suite": ["P1", "P1.4", "P1.5", "P2", "P3", "P4"],
          }
          report["status"] = "SYNTHETIC_ZERO_MODEL_PASS_LOCAL_RUNTIME_ADMISSION_REQUIRED"
          report["candidate_sha"] = subprocess.check_output(
              ["git", "rev-parse", "HEAD"], text=True
          ).strip()
          report["model_turn_executed"] = False
          report["scientific_attempt_created"] = False
          report["scientific_attempt_consumed"] = False
          p.write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps({
              "status": report["status"],
              "candidate_sha": report["candidate_sha"],
          }))

      - uses: actions/upload-artifact@v4
        with:
          name: g2e-p5a-cgw-synthetic-zero-model-qualification
          path: p5a-cgw-synthetic-qualification.json
          if-no-files-found: error

  windows-structural:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: src

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: powershell
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run synthetic qualification tests on Windows
        shell: powershell
        run: |
          pytest -q tests\g2e\test_p5a_cgw_zero_model_qualification.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Parse local zero-model one-click with Windows PowerShell
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "scripts\g2e\p5a_cgw_local_zero_model_oneclick.ps1",
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -ne 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

      - name: Assert no model-bearing code path exists
        shell: powershell
        run: |
          $src = Get-Content scripts\g2e\p5a_cgw_local_zero_model_oneclick.ps1 -Raw
          if ($src -match 'Invoke-RestMethod[^\r\n]*/v1/(?:responses|models)') {
            throw "MODEL_OR_CATALOG_ENDPOINT_CALL_FOUND"
          }
          $py = Get-Content scripts\g2e\p5a_cgw_bridge_qualification.py -Raw
          if ($py -match 'urllib|requests\.|httpx\.|aiohttp') {
            throw "NETWORK_CLIENT_FOUND_IN_QUALIFIER"
          }
          Write-Host "P5A_CGW_WINDOWS_ZERO_MODEL_FIREWALL_PASS"
