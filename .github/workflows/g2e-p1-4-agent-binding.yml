name: G2E P1.4 Agent Profile Binding Gate

on:
  workflow_dispatch:
  push:
    branches: ["feature/g2e-framework"]
    paths:
      - "src/g2e/schemas.py"
      - "src/g2e/standalone.py"
      - "src/g2e/gwf_adapter.py"
      - "tests/g2e/test_p1_4_agent_binding.py"
      - "tests/g2e/test_p4_gwf_adapter.py"
      - ".github/workflows/g2e-p1-4-agent-binding.yml"

permissions:
  contents: read

jobs:
  p1-4-agent-binding:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: src
      P1_4_PREIMPLEMENTATION_SHA: "995ca7a87e2acc3bdb7980046509b0061de48a4e"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -U pip && pip install -e ".[dev]"

      - name: Verify bounded implementation diff
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$P1_4_PREIMPLEMENTATION_SHA^{commit}"
          mapfile -t changed < <(git diff --name-only "$P1_4_PREIMPLEMENTATION_SHA"...HEAD)
          printf '%s\n' "${changed[@]}"
          allowed=(
            ".github/workflows/g2e-p1-4-agent-binding.yml"
            ".github/workflows/g2e-p5-preimplementation-qualification.yml"
            "src/g2e/schemas.py"
            "src/g2e/standalone.py"
            "src/g2e/gwf_adapter.py"
            "tests/g2e/test_p1_4_agent_binding.py"
            "tests/g2e/test_p4_gwf_adapter.py"
          )
          for path in "${changed[@]}"; do
            ok=false
            for item in "${allowed[@]}"; do
              if [[ "$path" == "$item" ]]; then ok=true; break; fi
            done
            if [[ "$ok" != true ]]; then
              echo "Out-of-scope P1.4 mutation: $path" >&2
              exit 1
            fi
          done

      - name: Compile G2E/GWF
        run: python -m compileall -q src/g2e src/gwr

      - name: Run P1 core regression
        run: pytest -q tests/g2e/test_p1_core_schemas.py

      - name: Run P1.4 agent binding qualification
        run: pytest -q tests/g2e/test_p1_4_agent_binding.py

      - name: Run P2 regression
        run: pytest -q tests/g2e/test_p2_deterministic_core.py

      - name: Run P3 regression
        run: pytest -q tests/g2e/test_p3_standalone_runtime.py

      - name: Run P4 regression plus GWF binding propagation
        run: pytest -q tests/g2e/test_p4_gwf_adapter.py

      - name: Assert provider-neutral implementation
        shell: bash
        run: |
          set -euo pipefail
          hits="$(find src/g2e src/gwr -type f \( -iname '*codex*' -o -iname '*chatgpt*' \) -print)"
          test -z "$hits"
          python - <<'PY'
          from pathlib import Path
          paths = [
              Path("src/g2e/schemas.py"),
              Path("src/g2e/standalone.py"),
              Path("src/g2e/gwf_adapter.py"),
          ]
          hits = []
          for path in paths:
              text = path.read_text(encoding="utf-8").lower()
              for token in ("codex", "chatgpt"):
                  if token in text:
                      hits.append((str(path), token))
          assert not hits, hits
          PY

      - name: Emit qualification report
        shell: bash
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()
          report = {
              "schema": "G2E-P1.4-AGENT-PROFILE-BINDING-v1",
              "candidate_sha": git("rev-parse", "HEAD"),
              "preimplementation_sha": "995ca7a87e2acc3bdb7980046509b0061de48a4e",
              "schema_blob": git("rev-parse", "HEAD:src/g2e/schemas.py"),
              "standalone_blob": git("rev-parse", "HEAD:src/g2e/standalone.py"),
              "gwf_adapter_blob": git("rev-parse", "HEAD:src/g2e/gwf_adapter.py"),
              "p1_4_test_blob": git("rev-parse", "HEAD:tests/g2e/test_p1_4_agent_binding.py"),
              "p4_test_blob": git("rev-parse", "HEAD:tests/g2e/test_p4_gwf_adapter.py"),
              "workflow_blob": git("rev-parse", "HEAD:.github/workflows/g2e-p1-4-agent-binding.yml"),
              "p1_4": "PASS",
              "provider_specific_runtime": False,
              "codex_runtime_authorized": False,
              "chatgpt_runtime_authorized": False,
          }
          Path("p1_4_agent_binding_report.json").write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          print(json.dumps(report, indent=2, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: g2e-p1-4-agent-binding
          path: p1_4_agent_binding_report.json
          if-no-files-found: error
