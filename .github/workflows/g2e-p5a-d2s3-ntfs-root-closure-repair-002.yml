name: G2E P5A D2-S3 NTFS Root Closure Repair 002 Gate

on:
  workflow_dispatch:
  push:
    branches: ["feature/g2e-framework"]
    paths:
      - "scripts/g2e/p5a_d2s3_platform_no_turn_oneclick.ps1"
      - "tests/g2e/test_p5a_d2s3_ntfs_root_closure_repair_002.py"
      - ".github/workflows/g2e-p5a-d2s3-ntfs-root-closure-repair-002.yml"

permissions:
  contents: read

jobs:
  repair-static:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: src
      BASELINE_SHA: "36a744e30c86a88fc8295670ca4392635836e253"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -U pip && pip install -e ".[dev]"

      - name: Verify bounded R2 repair diff
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$BASELINE_SHA^{commit}"
          mapfile -t changed < <(git diff --name-only "$BASELINE_SHA"...HEAD)
          printf '%s\n' "${changed[@]}"
          allowed=(
            ".github/workflows/g2e-p5a-d2s3-ntfs-root-closure-repair-002.yml"
            "scripts/g2e/p5a_d2s3_platform_no_turn_oneclick.ps1"
            "tests/g2e/test_p5a_d2s3_ntfs_root_closure_repair_002.py"
          )
          for path in "${changed[@]}"; do
            ok=false
            for item in "${allowed[@]}"; do
              if [[ "$path" == "$item" ]]; then ok=true; break; fi
            done
            if [[ "$ok" != true ]]; then
              echo "Out-of-scope D2-S3 R2 mutation: $path" >&2
              exit 1
            fi
          done

      - name: Verify Python preflight blob unchanged
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:scripts/g2e/p5a_d2s3_platform_no_turn_preflight.py)" = "ecd0af7cd487e14ea1691f4195af1d147efd0fe4"

      - name: Parse PowerShell R2 wrapper
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "scripts/g2e/p5a_d2s3_platform_no_turn_oneclick.ps1",
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -ne 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

      - name: Run R2 NTFS repair qualification
        run: pytest -q tests/g2e/test_p5a_d2s3_ntfs_root_closure_repair_002.py

      - name: Run original D2-S3 no-turn qualification
        run: pytest -q tests/g2e/test_p5a_d2s3_platform_no_turn_preflight.py

      - name: Run P1 regression
        run: pytest -q tests/g2e/test_p1_core_schemas.py

      - name: Run P1.4 regression
        run: pytest -q tests/g2e/test_p1_4_agent_binding.py

      - name: Run P1.5 regression
        run: pytest -q tests/g2e/test_p1_5_qualification_authority.py

      - name: Run P2 regression
        run: pytest -q tests/g2e/test_p2_deterministic_core.py

      - name: Run P3 regression
        run: pytest -q tests/g2e/test_p3_standalone_runtime.py

      - name: Run P4 regression
        run: pytest -q tests/g2e/test_p4_gwf_adapter.py

      - name: Emit R2 repair qualification report
        shell: bash
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()

          report = {
              "schema": "G2E-P5A-D2S3-NTFS-ROOT-CLOSURE-REPAIR-002-QUALIFICATION-v1",
              "baseline_sha": "36a744e30c86a88fc8295670ca4392635836e253",
              "candidate_sha": git("rev-parse", "HEAD"),
              "oneclick_blob": git("rev-parse", "HEAD:scripts/g2e/p5a_d2s3_platform_no_turn_oneclick.ps1"),
              "preflight_blob": git("rev-parse", "HEAD:scripts/g2e/p5a_d2s3_platform_no_turn_preflight.py"),
              "test_blob": git("rev-parse", "HEAD:tests/g2e/test_p5a_d2s3_ntfs_root_closure_repair_002.py"),
              "workflow_blob": git("rev-parse", "HEAD:.github/workflows/g2e-p5a-d2s3-ntfs-root-closure-repair-002.yml"),
              "repair_spec_blob": git("rev-parse", "HEAD:g2e/docs/P5A_D2S3_PRETURN_NTFS_ROOT_CLOSURE_REPAIR_002_SPEC.md"),
              "adjudication_blob": git("rev-parse", "HEAD:g2e/docs/P5A_D2S3_R1_LOCAL_PREFLIGHT_ADJUDICATION.md"),
              "bound_invalid_r1_report_sha256": "6b09fecc104ff334ee11c8e600c49110127996e3f6805a0bf93b77674cfb634f",
              "preflight_blob_unchanged": True,
              "turn_start_authorized": False,
              "scientific_attempt_authorized": False,
              "scientific_attempt_consumed": False,
              "model_turn_executed": False,
              "adjudication": "NTFS_ROOT_CLOSURE_REPAIR_PASS_ONE_LOCAL_R2_PREFLIGHT_REQUIRED",
          }
          Path("p5a_d2s3_ntfs_root_closure_repair_002_qualification.json").write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(report, indent=2, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: g2e-p5a-d2s3-ntfs-root-closure-repair-002-qualification
          path: p5a_d2s3_ntfs_root_closure_repair_002_qualification.json
          if-no-files-found: error

  repair-windows:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Parse with Windows PowerShell 5.1
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "scripts\g2e\p5a_d2s3_platform_no_turn_oneclick.ps1",
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -ne 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

      - name: Execute config serialization self-test
        shell: powershell
        run: |
          & ".\scripts\g2e\p5a_d2s3_platform_no_turn_oneclick.ps1" -ConfigSerializationSelfTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Execute NTFS root-classification self-test
        shell: powershell
        run: |
          & ".\scripts\g2e\p5a_d2s3_platform_no_turn_oneclick.ps1" -RootClassificationSelfTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
