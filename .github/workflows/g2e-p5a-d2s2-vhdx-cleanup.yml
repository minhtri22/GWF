name: G2E P5A D2-S2 VHDX Cleanup Gate

on:
  workflow_dispatch:
  push:
    branches: ["feature/g2e-framework"]
    paths:
      - "g2e/docs/P5A_D2S2_EPHEMERAL_VHDX_CLEANUP_CONTRACT.md"
      - "scripts/g2e/p5a_d2s2_cleanup_mounted_vhdx.ps1"
      - "tests/g2e/test_p5a_d2s2_vhdx_cleanup.py"
      - ".github/workflows/g2e-p5a-d2s2-vhdx-cleanup.yml"

permissions:
  contents: read

jobs:
  cleanup-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: src
      BASELINE_SHA: "6ce439278bd3555e287b75621c0a57b30dec170a"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -U pip && pip install -e ".[dev]"

      - name: Verify bounded cleanup diff
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$BASELINE_SHA^{commit}"
          mapfile -t changed < <(git diff --name-only "$BASELINE_SHA"...HEAD)
          printf '%s\n' "${changed[@]}"
          allowed=(
            ".github/workflows/g2e-p5a-d2s2-vhdx-cleanup.yml"
            "g2e/docs/P5A_D2S2_EPHEMERAL_VHDX_CLEANUP_CONTRACT.md"
            "scripts/g2e/p5a_d2s2_cleanup_mounted_vhdx.ps1"
            "tests/g2e/test_p5a_d2s2_vhdx_cleanup.py"
          )
          for path in "${changed[@]}"; do
            ok=false
            for item in "${allowed[@]}"; do
              if [[ "$path" == "$item" ]]; then ok=true; break; fi
            done
            if [[ "$ok" != true ]]; then
              echo "Out-of-scope cleanup mutation: $path" >&2
              exit 1
            fi
          done

      - name: Parse PowerShell cleanup
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "scripts/g2e/p5a_d2s2_cleanup_mounted_vhdx.ps1",
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -ne 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

      - name: Run cleanup qualification
        run: pytest -q tests/g2e/test_p5a_d2s2_vhdx_cleanup.py

      - name: Verify frozen historical one-click blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:scripts/g2e/p5a_d2s2_isolated_volume_oneclick.ps1)" = "1507b716645971ee60b0c2131973a953f98e7036"
          test "$(git rev-parse HEAD:scripts/g2e/p5a_d2s2_a1_ntfs_metadata_oneclick.ps1)" = "23b97c6e41e633782ac0fb69ae67d7596c05ac7d"
          test "$(git rev-parse HEAD:scripts/g2e/p5a_d2s2_a2_config_serialization_oneclick.ps1)" = "c714da50f577fad5e4fdd7b64ede894330459243"

      - name: Run P1 regression
        run: pytest -q tests/g2e/test_p1_core_schemas.py

      - name: Run P1.4 regression
        run: pytest -q tests/g2e/test_p1_4_agent_binding.py

      - name: Run P1.5 regression
        run: pytest -q tests/g2e/test_p1_5_qualification_authority.py

      - name: Run P2 regression
        run: pytest -q tests/g2e/test_p2_deterministic_core.py

      - name: Run P3 regression
        run: pytest -q tests/g2e/test_p3_standalone_runtime.py

      - name: Run P4 regression
        run: pytest -q tests/g2e/test_p4_gwf_adapter.py

      - name: Emit cleanup qualification report
        shell: bash
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path

          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()

          report = {
              "schema": "G2E-P5A-D2S2-VHDX-CLEANUP-QUALIFICATION-v1",
              "baseline_sha": "6ce439278bd3555e287b75621c0a57b30dec170a",
              "candidate_sha": git("rev-parse", "HEAD"),
              "cleanup_blob": git("rev-parse", "HEAD:scripts/g2e/p5a_d2s2_cleanup_mounted_vhdx.ps1"),
              "test_blob": git("rev-parse", "HEAD:tests/g2e/test_p5a_d2s2_vhdx_cleanup.py"),
              "workflow_blob": git("rev-parse", "HEAD:.github/workflows/g2e-p5a-d2s2-vhdx-cleanup.yml"),
              "contract_blob": git("rev-parse", "HEAD:g2e/docs/P5A_D2S2_EPHEMERAL_VHDX_CLEANUP_CONTRACT.md"),
              "adjudication": "VHDX_CLEANUP_PASS_LOCAL_EXECUTION_REQUIRED",
              "scientific_attempt_authorized": False,
              "scientific_attempt_consumed": False,
              "model_turn_executed": False,
          }
          Path("p5a_d2s2_vhdx_cleanup_qualification.json").write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(report, indent=2, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: g2e-p5a-d2s2-vhdx-cleanup-qualification
          path: p5a_d2s2_vhdx_cleanup_qualification.json
          if-no-files-found: error

  cleanup-windows:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Parse cleanup with Windows PowerShell
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "scripts\g2e\p5a_d2s2_cleanup_mounted_vhdx.ps1",
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -ne 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

      - name: Execute cleanup plan-only self-test
        shell: powershell
        run: |
          & ".\scripts\g2e\p5a_d2s2_cleanup_mounted_vhdx.ps1" -ProjectRoot "$PWD" -PlanOnly
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
