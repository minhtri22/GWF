name: G2E P5A D2-S3 Local Instrument Staging Gate

on:
  workflow_dispatch:
  push:
    branches: ["feature/g2e-framework"]
    paths:
      - "g2e/docs/P5A_D2S3_LOCAL_INSTRUMENT_STAGING_SPEC.md"
      - "scripts/g2e/p5a_d2s3_stage_release_coherent_instrument.ps1"
      - "tests/g2e/test_p5a_d2s3_local_instrument_staging.py"
      - ".github/workflows/g2e-p5a-d2s3-local-instrument-staging.yml"

permissions:
  contents: read

jobs:
  staging-static:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: src
      BASELINE_SHA: "b4549398972be770686e8ca10448fc179b578745"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -U pip && pip install -e ".[dev]"

      - name: Verify bounded staging diff
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$BASELINE_SHA^{commit}"
          mapfile -t changed < <(git diff --name-only "$BASELINE_SHA"...HEAD)
          printf '%s\n' "${changed[@]}"
          allowed=(
            ".github/workflows/g2e-p5a-d2s3-local-instrument-staging.yml"
            "scripts/g2e/p5a_d2s3_stage_release_coherent_instrument.ps1"
            "tests/g2e/test_p5a_d2s3_local_instrument_staging.py"
          )
          for path in "${changed[@]}"; do
            ok=false
            for item in "${allowed[@]}"; do
              if [[ "$path" == "$item" ]]; then ok=true; break; fi
            done
            if [[ "$ok" != true ]]; then
              echo "Out-of-scope D2-S3 staging mutation: $path" >&2
              exit 1
            fi
          done

      - name: Parse staging PowerShell
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "scripts/g2e/p5a_d2s3_stage_release_coherent_instrument.ps1",
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -ne 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

      - name: Run staging qualification
        run: pytest -q tests/g2e/test_p5a_d2s3_local_instrument_staging.py

      - name: Run P1 regression
        run: pytest -q tests/g2e/test_p1_core_schemas.py

      - name: Run P1.4 regression
        run: pytest -q tests/g2e/test_p1_4_agent_binding.py

      - name: Run P1.5 regression
        run: pytest -q tests/g2e/test_p1_5_qualification_authority.py

      - name: Run P2 regression
        run: pytest -q tests/g2e/test_p2_deterministic_core.py

      - name: Run P3 regression
        run: pytest -q tests/g2e/test_p3_standalone_runtime.py

      - name: Run P4 regression
        run: pytest -q tests/g2e/test_p4_gwf_adapter.py

      - name: Emit static qualification report
        shell: bash
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path

          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()

          report = {
              "schema": "G2E-P5A-D2S3-LOCAL-STAGING-STATIC-QUALIFICATION-v1",
              "baseline_sha": "b4549398972be770686e8ca10448fc179b578745",
              "candidate_sha": git("rev-parse", "HEAD"),
              "staging_script_blob": git("rev-parse", "HEAD:scripts/g2e/p5a_d2s3_stage_release_coherent_instrument.ps1"),
              "test_blob": git("rev-parse", "HEAD:tests/g2e/test_p5a_d2s3_local_instrument_staging.py"),
              "workflow_blob": git("rev-parse", "HEAD:.github/workflows/g2e-p5a-d2s3-local-instrument-staging.yml"),
              "spec_blob": git("rev-parse", "HEAD:g2e/docs/P5A_D2S3_LOCAL_INSTRUMENT_STAGING_SPEC.md"),
              "adjudication": "STATIC_PASS_WINDOWS_END_TO_END_REQUIRED",
              "scientific_attempt_authorized": False,
              "scientific_attempt_consumed": False,
              "model_turn_executed": False,
          }
          Path("p5a_d2s3_local_staging_static_qualification.json").write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: g2e-p5a-d2s3-local-staging-static-qualification
          path: p5a_d2s3_local_staging_static_qualification.json
          if-no-files-found: error

  staging-windows-e2e:
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - name: Parse with Windows PowerShell 5.1
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "scripts\g2e\p5a_d2s3_stage_release_coherent_instrument.ps1",
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -ne 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

      - name: Execute end-to-end official staging
        shell: powershell
        run: |
          & ".\scripts\g2e\p5a_d2s3_stage_release_coherent_instrument.ps1" -ProjectRoot "$PWD"
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Verify staged report and final package
        shell: powershell
        run: |
          $root = Join-Path "$PWD" "g2e\.local\P5A-D2S3-INSTRUMENT"
          $reportPath = Join-Path $root "report\P5A_D2S3_INSTRUMENT_STAGING_REPORT.json"
          if (-not (Test-Path -LiteralPath $reportPath)) { throw "REPORT_MISSING" }

          $r = Get-Content -LiteralPath $reportPath -Raw | ConvertFrom-Json
          if ($r.status -ne "STAGING_PASS_PLATFORM_PREFLIGHT_GATE_REQUIRED") { throw "STATUS_NOT_PASS" }
          if ($r.global_install_modified -ne $false) { throw "GLOBAL_MUTATION_FLAG" }
          if ($r.executables_invoked -ne $false) { throw "EXECUTION_FLAG" }
          if ($r.turn_start_request_sent -ne $false) { throw "TURN_FLAG" }
          if ($r.scientific_attempt_consumed -ne $false) { throw "ATTEMPT_FLAG" }
          if ($r.temp_cleanup.removed -ne $true) { throw "TEMP_NOT_REMOVED" }

          $codex = Join-Path $root "package\bin\codex.exe"
          $helper = Join-Path $root "package\codex-resources\codex-windows-sandbox-setup.exe"

          if ((Get-FileHash -LiteralPath $codex -Algorithm SHA256).Hash -ne "444A3F0008050605CAE73CD9B7A2DCAC61294062DFAAB56DD20430FD6498518B") {
            throw "FINAL_CODEX_HASH"
          }
          if ((Get-FileHash -LiteralPath $helper -Algorithm SHA256).Hash -ne "0C3EEB7CEE8D2BC4C8644DEF3C818E8B06760979572DCEDC919C38D0F38F64C4") {
            throw "FINAL_HELPER_HASH"
          }

          if ($r.codex.markers.'interactive-provision' -ne $false) { throw "CODEX_MODE_DRIFT" }
          if ($r.helper.markers.'interactive-provision' -ne $false) { throw "HELPER_MODE_DRIFT" }
          if ($r.codex.markers.full -ne $true -or $r.codex.markers.'provision-only' -ne $true) {
            throw "CODEX_REQUIRED_MARKERS"
          }
          if ($r.helper.markers.full -ne $true -or
              $r.helper.markers.'provision-only' -ne $true -or
              $r.helper.markers.'read-acls-only' -ne $true) {
            throw "HELPER_REQUIRED_MARKERS"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: g2e-p5a-d2s3-local-staging-windows-evidence
          path: g2e/.local/P5A-D2S3-INSTRUMENT/report/P5A_D2S3_INSTRUMENT_STAGING_REPORT.json
          if-no-files-found: error
