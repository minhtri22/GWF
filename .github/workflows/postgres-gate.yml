name: v0.5.1 PostgreSQL Gate

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  live-postgres-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: gwr
          POSTGRES_PASSWORD: gwr_test_password
          POSTGRES_DB: gwr_gate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gwr -d gwr_gate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      GWR_TEST_DATABASE_URL: postgresql://gwr:gwr_test_password@127.0.0.1:5432/gwr_gate
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime + PostgreSQL test dependencies
        run: python -m pip install -U pip && pip install -e ".[dev,postgres]"
      - name: PostgreSQL preflight
        run: python tools/preflight_v051_postgres.py --out evidence/v0.5.1/live_postgres_gate/preflight
      - name: Run full SQLite ↔ PostgreSQL gate
        run: python tools/run_v051_gate.py --out evidence/v0.5.1/live_postgres_gate
      - name: Assert v0.6 unblock gate
        run: |
          python - <<'PY'
          import json
          p='evidence/v0.5.1/live_postgres_gate/POSTGRES_GATE.json'
          d=json.load(open(p))
          assert d['status']=='PASS', d
          assert d['postgres_live_tested'] is True, d
          assert d['same_41_tests_sqlite_and_postgres'] is True, d
          assert d['six_research_cases_sqlite_and_postgres'] is True, d
          assert d['restart_persistence_equal'] is True, d
          assert d['semantic_equivalence'] is True, d
          assert d['v06_unblocked'] is True, d
          PY
      - name: Upload gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gwr-v051-postgres-gate-evidence
          path: evidence/v0.5.1/live_postgres_gate
