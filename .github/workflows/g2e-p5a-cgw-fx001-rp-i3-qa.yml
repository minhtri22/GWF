name: G2E P5A-CGW FX001 RP-I3 witness QA

on:
  push:
    branches:
      - research/p5a-cgw-fx001-transport-corrected
    paths:
      - "g2e/docs/P5A_CGW_FX001_RP_I3_DESIGN.json"
      - "scripts/g2e/p5a_cgw_fx001_rp_i3_outbound_witness.py"
      - "tests/g2e/test_p5a_cgw_fx001_rp_i3_outbound_witness.py"
      - ".github/workflows/g2e-p5a-cgw-fx001-rp-i3-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zero-model-static:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest PyYAML
      - run: python -m pytest -q tests/g2e/test_p5a_cgw_fx001_rp_i3_outbound_witness.py

  compile:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m py_compile scripts/g2e/p5a_cgw_fx001_rp_i3_outbound_witness.py
