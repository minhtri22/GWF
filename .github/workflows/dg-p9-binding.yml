name: DG-P9 Relation Target Binding Gate

on:
  workflow_dispatch:
  push:
    branches: ["v0.8.6-dg-p9-binding-implementation"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  dg-p9-sqlite:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: python -m pip install -U pip && pip install -e ".[dev]"
      - name: D9-F1 through D9-F20
        run: python -m pytest -q tests/test_dg_p9_relations.py
      - name: DG-P9 bounded binding gate
        run: python tools/run_dg_p9_gate.py --out evidence/dg-p9/sqlite/DG_P9_GATE.json
      - name: P8 Knowledge Trace regressions
        run: >-
          python -m pytest -q
          tests/test_dg_p8_relations.py
          tests/test_knowledge.py
          tests/test_execution_decision.py
          tests/test_persistence.py
          tests/test_dg_p4_document_facade.py
          tests/test_dg_p5_qa_findings.py
          tests/test_dg_p6_lifecycle_validity.py
          tests/test_dg_p7_authority.py
      - name: Full regression
        run: python -m pytest -q
      - name: Compile
        run: python -m compileall -q src tests tools
      - name: Upload SQLite DG-P9 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gwr-dg-p9-sqlite-evidence
          path: evidence/dg-p9/sqlite

  dg-p9-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: gwr
          POSTGRES_PASSWORD: gwr_test_password
          POSTGRES_DB: gwr_p9
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gwr -d gwr_p9"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      GWR_TEST_DATABASE_URL: postgresql://gwr:gwr_test_password@127.0.0.1:5432/gwr_p9
      GWR_TEST_NAMESPACE_PREFIX: gwr_dg_p9
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python + PostgreSQL dependencies
        run: python -m pip install -U pip && pip install -e ".[dev,postgres]"
      - name: D9-F1 through D9-F20 on PostgreSQL
        run: python -m pytest -q tests/test_dg_p9_relations.py
      - name: DG-P9 bounded binding gate on PostgreSQL
        run: python tools/run_dg_p9_gate.py --out evidence/dg-p9/postgres/DG_P9_GATE.json
      - name: Assert PostgreSQL evidence
        run: |
          python - <<'PY'
          import json
          d=json.load(open('evidence/dg-p9/postgres/DG_P9_GATE.json', encoding='utf-8'))
          assert d['status']=='PASS', d
          assert d['backend']=='postgresql', d
          assert all(d['checks'].values()), d
          assert '0011_v086_dg_p9_relation_binding' in d['migration_ids'], d
          PY
      - name: Upload PostgreSQL DG-P9 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gwr-dg-p9-postgres-evidence
          path: evidence/dg-p9/postgres
