name: DG-P6 Lifecycle Validity Gate

on:
  workflow_dispatch:
  push:
    branches: ["v0.8.6-dg-p6-lifecycle-validity"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  dg-p6-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install -U pip && pip install -e ".[dev]"

      - name: D6-F1 through D6-F20
        run: python -m pytest -q tests/test_dg_p6_lifecycle_validity.py

      - name: DG-P6 bounded state gate
        run: python tools/run_dg_p6_gate.py --out evidence/dg-p6/DG_P6_GATE.json

      - name: Assert zero-migration and validity compatibility
        run: |
          python - <<'PY'
          import json
          d=json.load(open('evidence/dg-p6/DG_P6_GATE.json', encoding='utf-8'))
          assert d['status']=='PASS', d
          assert all(d['checks'].values()), d
          assert not any('dg_p6' in x.lower() for x in d['migration_ids']), d
          assert 'BLOCKED' not in d['validity_vocabulary'], d
          PY

      - name: Knowledge Execution Decision P4 P5 regressions
        run: >-
          python -m pytest -q
          tests/test_knowledge.py
          tests/test_execution_decision.py
          tests/test_dg_p4_document_facade.py
          tests/test_dg_p5_qa_findings.py

      - name: Full regression
        run: python -m pytest -q

      - name: Compile
        run: python -m compileall -q src tests tools

      - name: Upload DG-P6 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gwr-dg-p6-evidence
          path: evidence/dg-p6/DG_P6_GATE.json
