name: G2E P5A D2 Qualification Authority Preimplementation

on:
  workflow_dispatch:
  push:
    branches: ["feature/g2e-framework"]
    paths:
      - "g2e/docs/P5A_D2_QUALIFICATION_AUTHORITY_ADMISSION_PREIMPLEMENTATION.md"
      - "tests/g2e/test_p5a_d2_qualification_authority_preimplementation.py"
      - ".github/workflows/g2e-p5a-d2-qualification-authority-preimplementation.yml"

permissions:
  contents: read

jobs:
  p5a-d2-qualification-authority-preimplementation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: src
      BASELINE_SHA: "11c04f7c7be88ebfd40ea6755a8bfc633262048d"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -U pip && pip install -e ".[dev]"

      - name: Verify zero-fresh specification-only diff
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$BASELINE_SHA^{commit}"
          mapfile -t changed < <(git diff --name-only "$BASELINE_SHA"...HEAD)
          printf '%s\n' "${changed[@]}"
          allowed=(
            ".github/workflows/g2e-p5a-d2-qualification-authority-preimplementation.yml"
            "g2e/docs/P5A_D2_QUALIFICATION_AUTHORITY_ADMISSION_PREIMPLEMENTATION.md"
            "tests/g2e/test_p5a_d2_qualification_authority_preimplementation.py"
          )
          for path in "${changed[@]}"; do
            ok=false
            for item in "${allowed[@]}"; do
              if [[ "$path" == "$item" ]]; then ok=true; break; fi
            done
            if [[ "$ok" != true ]]; then
              echo "Out-of-scope qualification-authority preimplementation mutation: $path" >&2
              exit 1
            fi
          done
          if git diff --name-only "$BASELINE_SHA"...HEAD | grep -E '^(src/g2e|src/gwr|scripts/g2e)/'; then
            echo "Specification-only phase must not mutate implementation" >&2
            exit 1
          fi
          if git ls-files | grep -E '(^|/)P5A_D2_(EXECUTION_RESULT|ADJUDICATION|RESULT)\.json$'; then
            echo "Fresh D2 outcome evidence exists before authority lock" >&2
            exit 1
          fi

      - name: Compile existing G2E/GWF
        run: python -m compileall -q src/g2e src/gwr

      - name: Run P1 regression
        run: pytest -q tests/g2e/test_p1_core_schemas.py

      - name: Run P1.4 regression
        run: pytest -q tests/g2e/test_p1_4_agent_binding.py

      - name: Run P2 regression
        run: pytest -q tests/g2e/test_p2_deterministic_core.py

      - name: Run P3 regression
        run: pytest -q tests/g2e/test_p3_standalone_runtime.py

      - name: Run P4 regression
        run: pytest -q tests/g2e/test_p4_gwf_adapter.py

      - name: Run qualification-authority zero-fresh QA
        run: pytest -q tests/g2e/test_p5a_d2_qualification_authority_preimplementation.py

      - name: Assert current schema remains unmodified and blocker remains real
        shell: bash
        run: |
          python - <<'PY'
          from g2e import AgentBinding
          assert "qualification_authority_ref" not in AgentBinding.model_fields
          assert "qualification_target_capability_ids" not in AgentBinding.model_fields
          print("P1.5 schema not implemented; specification-only boundary preserved")
          PY

      - name: Emit qualification report
        shell: bash
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path

          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()

          report = {
              "schema": "G2E-P5A-D2-QUALIFICATION-AUTHORITY-PREIMPLEMENTATION-v1",
              "candidate_sha": git("rev-parse", "HEAD"),
              "baseline_sha": "11c04f7c7be88ebfd40ea6755a8bfc633262048d",
              "spec_blob": git("rev-parse", "HEAD:g2e/docs/P5A_D2_QUALIFICATION_AUTHORITY_ADMISSION_PREIMPLEMENTATION.md"),
              "test_blob": git("rev-parse", "HEAD:tests/g2e/test_p5a_d2_qualification_authority_preimplementation.py"),
              "workflow_blob": git("rev-parse", "HEAD:.github/workflows/g2e-p5a-d2-qualification-authority-preimplementation.yml"),
              "adjudication": "SPEC_PASS_IMPLEMENTATION_REQUIRED",
              "blocking_finding": "D2-F01",
              "next_prerequisite": "P1.5_QUALIFICATION_ATTEMPT_AUTHORITY",
              "model_turn_authorized": False,
              "d2_execution_authorized": False,
              "runtime_adapter_authorized": False,
              "fresh_d2_outcome_consumed": False,
          }
          Path("p5a_d2_qualification_authority_preimplementation_report.json").write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(report, indent=2, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: g2e-p5a-d2-qualification-authority-preimplementation
          path: p5a_d2_qualification_authority_preimplementation_report.json
          if-no-files-found: error
