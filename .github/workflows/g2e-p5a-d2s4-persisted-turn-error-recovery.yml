name: G2E P5A D2-S4 Persisted Turn Error Recovery Gate

on:
  workflow_dispatch:
  push:
    branches: ["feature/g2e-framework"]
    paths:
      - "scripts/g2e/p5a_d2s4_recover_persisted_turn_error.py"
      - "scripts/g2e/p5a_d2s4_collect_persisted_turn_error.ps1"
      - "tests/g2e/test_p5a_d2s4_persisted_turn_error_recovery.py"
      - ".github/workflows/g2e-p5a-d2s4-persisted-turn-error-recovery.yml"

permissions:
  contents: read

jobs:
  recovery-static:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: src
      BASELINE_SHA: "6e76e2ef86252ec61896c4a0f5a0668fd06a3877"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -U pip && pip install -e ".[dev]"

      - name: Verify bounded recovery diff
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$BASELINE_SHA^{commit}"
          mapfile -t changed < <(git diff --name-only "$BASELINE_SHA"...HEAD)
          printf '%s\n' "${changed[@]}"
          allowed=(
            ".github/workflows/g2e-p5a-d2s4-persisted-turn-error-recovery.yml"
            "scripts/g2e/p5a_d2s4_recover_persisted_turn_error.py"
            "scripts/g2e/p5a_d2s4_collect_persisted_turn_error.ps1"
            "tests/g2e/test_p5a_d2s4_persisted_turn_error_recovery.py"
          )
          for path in "${changed[@]}"; do
            ok=false
            for item in "${allowed[@]}"; do
              if [[ "$path" == "$item" ]]; then ok=true; break; fi
            done
            if [[ "$ok" != true ]]; then
              echo "Out-of-scope D2-S4 persisted recovery mutation: $path" >&2
              exit 1
            fi
          done

      - name: Compile extractor
        run: python -m compileall -q scripts/g2e/p5a_d2s4_recover_persisted_turn_error.py

      - name: Parse recovery one-click
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "scripts/g2e/p5a_d2s4_collect_persisted_turn_error.ps1",
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -ne 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

      - name: Run persisted recovery qualification
        run: pytest -q tests/g2e/test_p5a_d2s4_persisted_turn_error_recovery.py

      - name: Run P1-P4 regressions
        run: |
          pytest -q tests/g2e/test_p1_core_schemas.py
          pytest -q tests/g2e/test_p1_4_agent_binding.py
          pytest -q tests/g2e/test_p1_5_qualification_authority.py
          pytest -q tests/g2e/test_p2_deterministic_core.py
          pytest -q tests/g2e/test_p3_standalone_runtime.py
          pytest -q tests/g2e/test_p4_gwf_adapter.py

  recovery-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: powershell
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Parse with Windows PowerShell 5.1
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "scripts\g2e\p5a_d2s4_collect_persisted_turn_error.ps1",
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -ne 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

      - name: Execute recovery infrastructure self-test
        shell: powershell
        run: |
          & ".\scripts\g2e\p5a_d2s4_collect_persisted_turn_error.ps1" -InfrastructureSelfTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run synthetic persisted recovery qualification
        shell: powershell
        run: |
          pytest -q tests\g2e\test_p5a_d2s4_persisted_turn_error_recovery.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Emit recovery qualification report
        shell: powershell
        run: |
          @'
          import json
          import subprocess
          from pathlib import Path

          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()

          report = {
              "schema": "G2E-P5A-D2S4-PERSISTED-TURN-ERROR-RECOVERY-QUALIFICATION-v1",
              "baseline_sha": "6e76e2ef86252ec61896c4a0f5a0668fd06a3877",
              "candidate_sha": git("rev-parse", "HEAD"),
              "extractor_blob": git("rev-parse", "HEAD:scripts/g2e/p5a_d2s4_recover_persisted_turn_error.py"),
              "wrapper_blob": git("rev-parse", "HEAD:scripts/g2e/p5a_d2s4_collect_persisted_turn_error.ps1"),
              "test_blob": git("rev-parse", "HEAD:tests/g2e/test_p5a_d2s4_persisted_turn_error_recovery.py"),
              "workflow_blob": git("rev-parse", "HEAD:.github/workflows/g2e-p5a-d2s4-persisted-turn-error-recovery.yml"),
              "spec_blob": git("rev-parse", "HEAD:g2e/docs/P5A_D2S4_PERSISTED_TURN_ERROR_RECOVERY_SPEC.md"),
              "thread_id": "01a0c9af-d509-7203-9608-06304738b12e",
              "turn_id": "01a0c9af-d523-72f3-84fa-a575e91076b6",
              "codex_started": False,
              "rpc_sent": False,
              "vhdx_mounted": False,
              "scientific_attempt_retried": False,
              "secret_redaction_test": "PASS",
              "session_jsonl_recovery_test": "PASS",
              "sqlite_read_only_recovery_test": "PASS",
              "adjudication": "D2S4_PERSISTED_TURN_ERROR_RECOVERY_PASS_ONE_LOCAL_COLLECTION_REQUIRED",
          }
          Path("d2s4-persisted-turn-error-recovery-qualification.json").write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(report, indent=2, sort_keys=True))
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: g2e-p5a-d2s4-persisted-turn-error-recovery-qualification
          path: d2s4-persisted-turn-error-recovery-qualification.json
          if-no-files-found: error
