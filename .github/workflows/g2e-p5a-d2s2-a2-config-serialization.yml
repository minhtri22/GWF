name: G2E P5A D2-S2 A2 Config Serialization Gate

on:
  workflow_dispatch:
  push:
    branches: ["feature/g2e-framework"]
    paths:
      - "g2e/docs/P5A_D2S2_A2_CONFIG_SERIALIZATION_PRETURN_AMENDMENT.md"
      - "scripts/g2e/p5a_d2s2_a2_config_serialization_preflight.py"
      - "scripts/g2e/p5a_d2s2_a2_config_serialization_oneclick.ps1"
      - "tests/g2e/test_p5a_d2s2_a2_config_serialization.py"
      - ".github/workflows/g2e-p5a-d2s2-a2-config-serialization.yml"

permissions:
  contents: read

jobs:
  a2-linux-qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: src
      BASELINE_SHA: "d415994b51e0987829c31beee9d281cc19818cd8"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -U pip && pip install -e ".[dev]"

      - name: Verify bounded A2 diff
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$BASELINE_SHA^{commit}"
          mapfile -t changed < <(git diff --name-only "$BASELINE_SHA"...HEAD)
          printf '%s\n' "${changed[@]}"
          allowed=(
            ".github/workflows/g2e-p5a-d2s2-a2-config-serialization.yml"
            "scripts/g2e/p5a_d2s2_a2_config_serialization_preflight.py"
            "scripts/g2e/p5a_d2s2_a2_config_serialization_oneclick.ps1"
            "tests/g2e/test_p5a_d2s2_a2_config_serialization.py"
          )
          for path in "${changed[@]}"; do
            ok=false
            for item in "${allowed[@]}"; do
              if [[ "$path" == "$item" ]]; then ok=true; break; fi
            done
            if [[ "$ok" != true ]]; then
              echo "Out-of-scope D2-S2 A2 mutation: $path" >&2
              exit 1
            fi
          done

      - name: Compile A2 preflight
        run: python -m compileall -q scripts/g2e/p5a_d2s2_a2_config_serialization_preflight.py

      - name: Parse A2 PowerShell
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "scripts/g2e/p5a_d2s2_a2_config_serialization_oneclick.ps1",
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -ne 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

      - name: Run A2 qualification
        run: pytest -q tests/g2e/test_p5a_d2s2_a2_config_serialization.py

      - name: Run P1 regression
        run: pytest -q tests/g2e/test_p1_core_schemas.py

      - name: Run P1.4 regression
        run: pytest -q tests/g2e/test_p1_4_agent_binding.py

      - name: Run P1.5 regression
        run: pytest -q tests/g2e/test_p1_5_qualification_authority.py

      - name: Run P2 regression
        run: pytest -q tests/g2e/test_p2_deterministic_core.py

      - name: Run P3 regression
        run: pytest -q tests/g2e/test_p3_standalone_runtime.py

      - name: Run P4 regression
        run: pytest -q tests/g2e/test_p4_gwf_adapter.py

      - name: Prove A2 no-turn firewall
        shell: bash
        run: |
          set -euo pipefail
          ! grep -F '"turn/start"' scripts/g2e/p5a_d2s2_a2_config_serialization_preflight.py
          ! grep -F '"turn/start"' scripts/g2e/p5a_d2s2_a2_config_serialization_oneclick.ps1

      - name: Verify predecessor and A1 packages immutable
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:scripts/g2e/p5a_d2s2_isolated_volume_oneclick.ps1)" = "1507b716645971ee60b0c2131973a953f98e7036"
          test "$(git rev-parse HEAD:scripts/g2e/p5a_d2s2_isolated_volume_preflight.py)" = "005bd3ff5f34ea60a05d15baa25a0d4f6e9341c3"
          test "$(git rev-parse HEAD:scripts/g2e/p5a_d2s2_a1_ntfs_metadata_oneclick.ps1)" = "23b97c6e41e633782ac0fb69ae67d7596c05ac7d"
          test "$(git rev-parse HEAD:scripts/g2e/p5a_d2s2_a1_ntfs_metadata_preflight.py)" = "df3dcf3194d1f6198e75be8d2d46f1f22b8591b5"

      - name: Emit A2 qualification report
        shell: bash
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path

          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()

          report = {
              "schema": "G2E-P5A-D2S2-A2-CONFIG-SERIALIZATION-QUALIFICATION-v1",
              "baseline_sha": "d415994b51e0987829c31beee9d281cc19818cd8",
              "candidate_sha": git("rev-parse", "HEAD"),
              "oneclick_blob": git("rev-parse", "HEAD:scripts/g2e/p5a_d2s2_a2_config_serialization_oneclick.ps1"),
              "preflight_blob": git("rev-parse", "HEAD:scripts/g2e/p5a_d2s2_a2_config_serialization_preflight.py"),
              "test_blob": git("rev-parse", "HEAD:tests/g2e/test_p5a_d2s2_a2_config_serialization.py"),
              "workflow_blob": git("rev-parse", "HEAD:.github/workflows/g2e-p5a-d2s2-a2-config-serialization.yml"),
              "amendment_blob": git("rev-parse", "HEAD:g2e/docs/P5A_D2S2_A2_CONFIG_SERIALIZATION_PRETURN_AMENDMENT.md"),
              "adjudication": "A2_IMPLEMENTATION_PASS_WINDOWS_PS51_REQUIRED",
              "scientific_attempt_authorized": False,
              "scientific_attempt_consumed": False,
              "model_turn_executed": False,
          }
          Path("p5a_d2s2_a2_qualification.json").write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(report, indent=2, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: g2e-p5a-d2s2-a2-config-serialization-qualification
          path: p5a_d2s2_a2_qualification.json
          if-no-files-found: error

  a2-windows-powershell51:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Execute Windows PowerShell 5.1 serialization self-test
        shell: powershell
        run: |
          $PSVersionTable.PSVersion
          & ".\scripts\g2e\p5a_d2s2_a2_config_serialization_oneclick.ps1" -ConfigSerializationSelfTest
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
