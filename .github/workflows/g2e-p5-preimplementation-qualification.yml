name: G2E P5 Pre-Implementation Qualification

on:
  workflow_dispatch:
  push:
    branches: ["feature/g2e-framework"]
    paths:
      - "g2e/docs/P5_PREIMPLEMENTATION_QUALIFICATION.md"
      - "tests/g2e/test_p5_preimplementation_qualification.py"
      - ".github/workflows/g2e-p5-preimplementation-qualification.yml"
      - "g2e/docs/PRD_09_AGENT_APP_ADAPTERS.md"
      - "g2e/docs/PRD_07_EXECUTION_PROTOCOL.md"
      - "g2e/docs/PRD_08_GWF_ADAPTER.md"
      - "g2e/docs/PRD_14_SECURITY_AUTHORITY.md"
      - "g2e/docs/CORE_SEMANTICS.md"
      - "src/g2e/schemas.py"

permissions:
  contents: read

jobs:
  p5-preimplementation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: src
      P5_BASELINE_SHA: "660cfbb98ab2066e3fb94adda7657087de9ab26f"
      P1_SCHEMA_BLOB: "62b4ab6717bc6c0a00f3670c73024df5a6ad41ca"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install GWF/G2E test dependencies
        run: python -m pip install -U pip && pip install -e ".[dev]"

      - name: Verify candidate is zero-implementation relative to audit baseline
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$P5_BASELINE_SHA^{commit}"
          mapfile -t changed < <(git diff --name-only "$P5_BASELINE_SHA"...HEAD)
          printf '%s\n' "${changed[@]}"
          allowed=(
            ".github/workflows/g2e-p5-preimplementation-qualification.yml"
            "g2e/docs/P5_PREIMPLEMENTATION_QUALIFICATION.md"
            "tests/g2e/test_p5_preimplementation_qualification.py"
          )
          for path in "${changed[@]}"; do
            ok=false
            for item in "${allowed[@]}"; do
              if [[ "$path" == "$item" ]]; then
                ok=true
                break
              fi
            done
            if [[ "$ok" != true ]]; then
              echo "Unexpected preimplementation mutation: $path" >&2
              exit 1
            fi
          done

      - name: Verify qualified P1 schema blob is unchanged
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD:src/g2e/schemas.py)"
          echo "schemas.py blob=$actual"
          test "$actual" = "$P1_SCHEMA_BLOB"

      - name: Compile existing G2E/GWF runtime
        run: python -m compileall -q src/g2e src/gwr

      - name: Run P1 regression
        run: pytest -q tests/g2e/test_p1_core_schemas.py

      - name: Run P2 regression
        run: pytest -q tests/g2e/test_p2_deterministic_core.py

      - name: Run P3 regression
        run: pytest -q tests/g2e/test_p3_standalone_runtime.py

      - name: Run P4 regression
        run: pytest -q tests/g2e/test_p4_gwf_adapter.py

      - name: Run P5 zero-implementation qualification
        run: pytest -q tests/g2e/test_p5_preimplementation_qualification.py

      - name: Assert no Codex or ChatGPT runtime adapter was introduced
        shell: bash
        run: |
          set -euo pipefail
          hits="$(find src/g2e src/gwr -type f \( -iname '*codex*' -o -iname '*chatgpt*' \) -print)"
          if [[ -n "$hits" ]]; then
            echo "$hits" >&2
            exit 1
          fi

      - name: Emit qualification report
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()

          report = {
              "schema": "G2E-P5-PREIMPLEMENTATION-QUALIFICATION-v1",
              "candidate_sha": git("rev-parse", "HEAD"),
              "baseline_sha": os.environ["P5_BASELINE_SHA"],
              "spec_blob": git("rev-parse", "HEAD:g2e/docs/P5_PREIMPLEMENTATION_QUALIFICATION.md"),
              "test_blob": git("rev-parse", "HEAD:tests/g2e/test_p5_preimplementation_qualification.py"),
              "workflow_blob": git("rev-parse", "HEAD:.github/workflows/g2e-p5-preimplementation-qualification.yml"),
              "p1_schema_blob": git("rev-parse", "HEAD:src/g2e/schemas.py"),
              "runtime_adapter_mutation": False,
              "p5_preimplementation_spec": "PASS",
              "runtime_implementation_authorized": False,
              "adjudication": "SPEC_PASS_RUNTIME_BLOCKED",
              "blocking_prerequisite": "P1.4_AGENT_PROFILE_BINDING_IDENTITY",
              "findings": ["P5-F01", "P5-F02"],
          }
          Path("p5_preimplementation_report.json").write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(report, indent=2, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: g2e-p5-preimplementation-qualification
          path: p5_preimplementation_report.json
          if-no-files-found: error
