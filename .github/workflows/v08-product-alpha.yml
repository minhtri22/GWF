name: v0.8 Product Alpha Regression

on:
  workflow_dispatch:
  push:
    branches: ["main", "v0.8-research-product-alpha"]

permissions:
  contents: read

jobs:
  gate-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: gwr
          POSTGRES_PASSWORD: gwr_test_password
          POSTGRES_DB: gwr_gate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gwr -d gwr_gate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      GWR_TEST_DATABASE_URL: postgresql://gwr:gwr_test_password@127.0.0.1:5432/gwr_gate
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime + PostgreSQL dependencies
        run: python -m pip install -U pip && pip install -e ".[dev,postgres]"
      - name: Run v0.8 product regression gate
        run: python tools/run_v08_gate.py --out evidence/v0.8/live_gate
      - name: Build UAT regression artifact
        run: python tools/build_uat_site.py --out dist/uat --commit "$GITHUB_SHA"
      - name: Assert v0.8 regression
        run: |
          python - <<'PY'
          import json
          d=json.load(open('evidence/v0.8/live_gate/V08_GATE.json'))
          assert d['status']=='PASS', d
          assert d['v07_regression_pass'] is True, d
          assert d['domain_sdk_pass'] is True, d
          assert d['operator_dashboard_pass'] is True, d
          assert d['human_approval_ux_contract_pass'] is True, d
          assert d['failure_recovery_visualization_data_pass'] is True, d
          assert d['uat_site_build_pass'] is True, d
          PY
      - name: Upload v0.8 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gwr-v08-gate-evidence
          path: evidence/v0.8/live_gate
