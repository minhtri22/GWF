name: G2E P5A D2-S2 Isolated Volume Gate

on:
  workflow_dispatch:
  push:
    branches: ["feature/g2e-framework"]
    paths:
      - "scripts/g2e/p5a_d2s2_isolated_volume_preflight.py"
      - "scripts/g2e/p5a_d2s2_isolated_volume_oneclick.ps1"
      - "tests/g2e/test_p5a_d2s2_isolated_volume_preflight.py"
      - ".github/workflows/g2e-p5a-d2s2-isolated-volume.yml"

permissions:
  contents: read

jobs:
  p5a-d2s2-isolated-volume:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: src
      BASELINE_SHA: "e1b1c2e64a8ee341974a5635b831d46cc4f01198"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -U pip && pip install -e ".[dev]"

      - name: Verify bounded implementation diff
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$BASELINE_SHA^{commit}"
          mapfile -t changed < <(git diff --name-only "$BASELINE_SHA"...HEAD)
          printf '%s\n' "${changed[@]}"
          allowed=(
            ".github/workflows/g2e-p5a-d2s2-isolated-volume.yml"
            "scripts/g2e/p5a_d2s2_isolated_volume_preflight.py"
            "scripts/g2e/p5a_d2s2_isolated_volume_oneclick.ps1"
            "tests/g2e/test_p5a_d2s2_isolated_volume_preflight.py"
          )
          for path in "${changed[@]}"; do
            ok=false
            for item in "${allowed[@]}"; do
              if [[ "$path" == "$item" ]]; then ok=true; break; fi
            done
            if [[ "$ok" != true ]]; then
              echo "Out-of-scope D2-S2 mutation: $path" >&2
              exit 1
            fi
          done

      - name: Compile Python preflight
        run: python -m compileall -q scripts/g2e/p5a_d2s2_isolated_volume_preflight.py

      - name: Parse PowerShell one-click
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "scripts/g2e/p5a_d2s2_isolated_volume_oneclick.ps1",
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -ne 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

      - name: Run P1 regression
        run: pytest -q tests/g2e/test_p1_core_schemas.py

      - name: Run P1.4 regression
        run: pytest -q tests/g2e/test_p1_4_agent_binding.py

      - name: Run P1.5 regression
        run: pytest -q tests/g2e/test_p1_5_qualification_authority.py

      - name: Run P2 regression
        run: pytest -q tests/g2e/test_p2_deterministic_core.py

      - name: Run P3 regression
        run: pytest -q tests/g2e/test_p3_standalone_runtime.py

      - name: Run P4 regression
        run: pytest -q tests/g2e/test_p4_gwf_adapter.py

      - name: Run D2-S2 static qualification
        run: pytest -q tests/g2e/test_p5a_d2s2_isolated_volume_preflight.py

      - name: Prove no scientific dispatch token exists
        shell: bash
        run: |
          set -euo pipefail
          if grep -F '"turn/start"' scripts/g2e/p5a_d2s2_isolated_volume_preflight.py; then
            echo "D2-S2 preflight contains scientific dispatch" >&2
            exit 1
          fi
          if grep -F '"turn/start"' scripts/g2e/p5a_d2s2_isolated_volume_oneclick.ps1; then
            echo "D2-S2 one-click contains scientific dispatch" >&2
            exit 1
          fi

      - name: Emit qualification report
        shell: bash
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()

          report = {
              "schema": "G2E-P5A-D2S2-ISOLATED-VOLUME-QUALIFICATION-v1",
              "candidate_sha": git("rev-parse", "HEAD"),
              "baseline_sha": "e1b1c2e64a8ee341974a5635b831d46cc4f01198",
              "preflight_blob": git("rev-parse", "HEAD:scripts/g2e/p5a_d2s2_isolated_volume_preflight.py"),
              "oneclick_blob": git("rev-parse", "HEAD:scripts/g2e/p5a_d2s2_isolated_volume_oneclick.ps1"),
              "test_blob": git("rev-parse", "HEAD:tests/g2e/test_p5a_d2s2_isolated_volume_preflight.py"),
              "workflow_blob": git("rev-parse", "HEAD:.github/workflows/g2e-p5a-d2s2-isolated-volume.yml"),
              "adjudication": "IMPLEMENTATION_PASS_LOCAL_EXECUTION_REQUIRED",
              "model_turn_executed": False,
              "scientific_attempt_authorized": False,
              "runtime_adapter_authorized": False,
          }
          Path("p5a_d2s2_isolated_volume_qualification.json").write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(report, indent=2, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: g2e-p5a-d2s2-isolated-volume-qualification
          path: p5a_d2s2_isolated_volume_qualification.json
          if-no-files-found: error
