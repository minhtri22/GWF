name: G2E P5A.1 Codex D1 Adjudication Lock

on:
  workflow_dispatch:
  push:
    branches: ["feature/g2e-framework"]
    paths:
      - "g2e/docs/P5A_D1_ADJUDICATION_LOCK.md"
      - "scripts/g2e/p5a_adjudicate_d1.py"
      - "tests/g2e/test_p5a_d1_adjudication_lock.py"
      - ".github/workflows/g2e-p5a-d1-adjudication-lock.yml"

permissions:
  contents: read

jobs:
  p5a-d1-adjudication-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: src
      P5A1_BASELINE_SHA: "dea34428cb644a221d34a143a738c35b196d3f05"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -U pip && pip install -e ".[dev]"

      - name: Verify zero-fresh bounded diff
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$P5A1_BASELINE_SHA^{commit}"
          mapfile -t changed < <(git diff --name-only "$P5A1_BASELINE_SHA"...HEAD)
          printf '%s\n' "${changed[@]}"
          allowed=(
            ".github/workflows/g2e-p5a-d1-adjudication-lock.yml"
            "g2e/docs/P5A_D1_ADJUDICATION_LOCK.md"
            "scripts/g2e/p5a_adjudicate_d1.py"
            "tests/g2e/test_p5a_d1_adjudication_lock.py"
          )
          for path in "${changed[@]}"; do
            ok=false
            for item in "${allowed[@]}"; do
              if [[ "$path" == "$item" ]]; then ok=true; break; fi
            done
            if [[ "$ok" != true ]]; then
              echo "Out-of-scope P5A.1 mutation: $path" >&2
              exit 1
            fi
          done
          if git diff --name-only "$P5A1_BASELINE_SHA"...HEAD | grep -E '^(src/g2e|src/gwr)/'; then
            echo "P5A.1 must not mutate runtime/core implementation" >&2
            exit 1
          fi
          if git ls-files | grep -E '(^|/)P5A_CODEX_DISCOVERY\.json$'; then
            echo "Fresh actual-harness discovery evidence already exists in repo" >&2
            exit 1
          fi

      - name: Compile G2E/GWF and adjudicator
        run: python -m compileall -q src/g2e src/gwr scripts/g2e/p5a_adjudicate_d1.py

      - name: Run P1 regression
        run: pytest -q tests/g2e/test_p1_core_schemas.py

      - name: Run P1.4 regression
        run: pytest -q tests/g2e/test_p1_4_agent_binding.py

      - name: Run P2 regression
        run: pytest -q tests/g2e/test_p2_deterministic_core.py

      - name: Run P3 regression
        run: pytest -q tests/g2e/test_p3_standalone_runtime.py

      - name: Run P4 regression
        run: pytest -q tests/g2e/test_p4_gwf_adapter.py

      - name: Run P5A preparation regression
        run: pytest -q tests/g2e/test_p5a_codex_discovery_preparation.py

      - name: Run P5A.1 frozen adjudicator qualification
        run: pytest -q tests/g2e/test_p5a_d1_adjudication_lock.py

      - name: Assert adjudicator has no execution path
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          source = Path("scripts/g2e/p5a_adjudicate_d1.py").read_text(encoding="utf-8")
          forbidden = (
              "subprocess",
              "ProofObligation",
              "ExecutionAttemptEnvelope",
              "AgentBinding",
              "Popen(",
              "os.system",
              "shutil.which",
          )
          hits = [token for token in forbidden if token in source]
          assert not hits, hits
          PY

      - name: Emit zero-fresh lock report
        shell: bash
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path

          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()

          report = {
              "schema": "G2E-P5A-D1-ADJUDICATION-LOCK-v1",
              "candidate_sha": git("rev-parse", "HEAD"),
              "baseline_sha": "dea34428cb644a221d34a143a738c35b196d3f05",
              "lock_blob": git("rev-parse", "HEAD:g2e/docs/P5A_D1_ADJUDICATION_LOCK.md"),
              "adjudicator_blob": git("rev-parse", "HEAD:scripts/g2e/p5a_adjudicate_d1.py"),
              "test_blob": git("rev-parse", "HEAD:tests/g2e/test_p5a_d1_adjudication_lock.py"),
              "workflow_blob": git("rev-parse", "HEAD:.github/workflows/g2e-p5a-d1-adjudication-lock.yml"),
              "fresh_actual_harness_evidence_consumed": False,
              "adjudication_rule": "FROZEN",
              "runtime_adapter_authorized": False,
              "d2_authorized": False,
              "next": "ONE_TARGET_HARNESS_DISCOVERY_RUN_THEN_FROZEN_D1_ADJUDICATION",
          }
          Path("p5a_d1_adjudication_lock_report.json").write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(report, indent=2, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: g2e-p5a-d1-adjudication-lock
          path: p5a_d1_adjudication_lock_report.json
          if-no-files-found: error
