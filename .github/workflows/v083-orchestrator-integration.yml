name: v0.8.3 Orchestrator Integration Gate

on:
  workflow_dispatch:
  push:
    branches: ["main", "v0.8.3-orchestrator-integration"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  v083-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: gwr
          POSTGRES_PASSWORD: gwr_test_password
          POSTGRES_DB: gwr_gate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gwr -d gwr_gate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      GWR_TEST_DATABASE_URL: postgresql://gwr:gwr_test_password@127.0.0.1:5432/gwr_gate
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime + PostgreSQL dependencies
        run: python -m pip install -U pip && pip install -e ".[dev,postgres]"
      - name: Run v0.8.3 gate
        run: python tools/run_v083_gate.py --out evidence/v0.8.3/live_gate
      - name: Assert v0.8.3 ready
        run: |
          python - <<'PY'
          import json
          d=json.load(open('evidence/v0.8.3/live_gate/V083_GATE.json'))
          assert d['status']=='PASS', d
          assert d['v082_regression_pass'] is True, d
          assert d['postgres_live_tested'] is True, d
          assert d['sqlite_v083_pass'] is True, d
          assert d['postgres_v083_pass'] is True, d
          assert d['protocol_driven_orchestration_pass'] is True, d
          assert d['domain_skill_binding_pass'] is True, d
          assert d['handoff_chain_pass'] is True, d
          assert d['recovery_hierarchy_pass'] is True, d
          assert d['archive_enforcement_pass'] is True, d
          assert d['live_operational_events_pass'] is True, d
          assert d['static_uat_boundary_preserved'] is True, d
          PY
      - name: Upload v0.8.3 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gwr-v083-gate-evidence
          path: evidence/v0.8.3/live_gate
