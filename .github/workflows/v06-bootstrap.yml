name: Bootstrap v0.6 source
on:
  push:
    branches: ["v0.6-identity-multitenancy"]
    paths:
      - "bootstrap/**"
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and extract v0.6 source
        shell: bash
        run: |
          set -euo pipefail
          echo "313ad720fc436e6724e8d81d99c2f863491c619dbf5e0585755ec8400d882c6c  bootstrap/v06-source.tar.xz" | sha256sum -c -
          tar -xJf bootstrap/v06-source.tar.xz
          python -m compileall -q src tests tools
      - name: Commit expanded v0.6 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -- .github/workflows
          rm -f .github/workflows/v06-gate.yml
          find src tests tools -type d -name __pycache__ -prune -exec rm -rf {} +
          find src tests tools -type f -name '*.pyc' -delete
          rm -rf bootstrap
          git add -A
          git commit -m "feat: implement v0.6 identity and multi-tenancy"
          git push origin HEAD:v0.6-identity-multitenancy
