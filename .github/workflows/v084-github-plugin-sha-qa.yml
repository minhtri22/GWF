name: v0.8.4 GitHub Plugin SHA QA Gate

on:
  workflow_dispatch:
  push:
    branches: ["main", "v0.8.4-github-plugin-sha-qa"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  v084-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: gwr
          POSTGRES_PASSWORD: gwr_test_password
          POSTGRES_DB: gwr_gate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gwr -d gwr_gate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      GWR_TEST_DATABASE_URL: postgresql://gwr:gwr_test_password@127.0.0.1:5432/gwr_gate
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime + PostgreSQL dependencies
        run: python -m pip install -U pip && pip install -e ".[dev,postgres]"
      - name: Run v0.8.4 gate
        run: python tools/run_v084_gate.py --out evidence/v0.8.4/live_gate
      - name: Assert v0.8.4 ready
        run: |
          python - <<'PY'
          import json
          d=json.load(open('evidence/v0.8.4/live_gate/V084_GATE.json'))
          assert d['status']=='PASS', d
          assert d['v083_regression_pass'] is True, d
          assert d['postgres_live_tested'] is True, d
          assert d['sqlite_v084_pass'] is True, d
          assert d['postgres_v084_pass'] is True, d
          assert d['recovery_modes_configurable_pass'] is True, d
          assert d['plugin_secret_boundary_pass'] is True, d
          assert d['github_sha_safe_commit_pass'] is True, d
          assert d['provider_race_blocked_pass'] is True, d
          assert d['standard_sha_qa_pass'] is True, d
          PY
      - name: Upload v0.8.4 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gwr-v084-gate-evidence
          path: evidence/v0.8.4/live_gate
