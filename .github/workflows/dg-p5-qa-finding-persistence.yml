name: DG-P5 QA Finding Persistence Gate

on:
  workflow_dispatch:
  push:
    branches: ["v0.8.6-dg-p5-qa-finding-persistence"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  dg-p5-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install -U pip && pip install -e ".[dev]"

      - name: D5-F1 through D5-F20
        run: python -m pytest -q tests/test_dg_p5_qa_findings.py

      - name: DG-P5 schema and primitive smoke
        run: python tools/run_dg_p5_gate.py --out evidence/dg-p5/DG_P5_GATE.json

      - name: Assert bounded DG-P5 gate
        run: |
          python - <<'PY'
          import json
          d=json.load(open('evidence/dg-p5/DG_P5_GATE.json', encoding='utf-8'))
          assert d['status']=='PASS', d
          assert all(d['checks'].values()), d
          assert '0008_v086_dg_p5_document_findings' in d['migration_ids'], d
          PY

      - name: Evidence Gate Failure regressions
        run: >-
          python -m pytest -q
          tests/test_knowledge.py
          tests/test_recovery.py
          tests/test_e2e_research.py
          tests/test_dg_p4_document_facade.py

      - name: Full regression
        run: python -m pytest -q

      - name: Compile
        run: python -m compileall -q src tests tools

      - name: Upload DG-P5 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gwr-dg-p5-evidence
          path: evidence/dg-p5/DG_P5_GATE.json
