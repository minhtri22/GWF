name: G2E P5A D2 Final Zero-Fresh Admission

on:
  workflow_dispatch:
  push:
    branches: ["feature/g2e-framework"]
    paths:
      - "g2e/docs/P5A_D2_FINAL_ADMISSION_MATERIALIZATION_AND_ZERO_FRESH_QUALIFICATION.md"
      - "scripts/g2e/p5a_d2_final_admission.py"
      - "tests/g2e/test_p5a_d2_final_admission.py"
      - ".github/workflows/g2e-p5a-d2-final-admission.yml"

permissions:
  contents: read

jobs:
  p5a-d2-final-admission:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: src
      BASELINE_SHA: "926d6a46344e8ac4822907fdc6b597f8d6ba6feb"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -U pip && pip install -e ".[dev]"

      - name: Verify bounded zero-fresh diff
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$BASELINE_SHA^{commit}"
          mapfile -t changed < <(git diff --name-only "$BASELINE_SHA"...HEAD)
          printf '%s\n' "${changed[@]}"
          allowed=(
            ".github/workflows/g2e-p5a-d2-final-admission.yml"
            "g2e/docs/P5A_D2_FINAL_ADMISSION_MATERIALIZATION_AND_ZERO_FRESH_QUALIFICATION.md"
            "scripts/g2e/p5a_d2_final_admission.py"
            "tests/g2e/test_p5a_d2_final_admission.py"
          )
          for path in "${changed[@]}"; do
            ok=false
            for item in "${allowed[@]}"; do
              if [[ "$path" == "$item" ]]; then ok=true; break; fi
            done
            if [[ "$ok" != true ]]; then
              echo "Out-of-scope final-admission mutation: $path" >&2
              exit 1
            fi
          done
          if git diff --name-only "$BASELINE_SHA"...HEAD | grep -E '^(src/g2e|src/gwr)/'; then
            echo "Final admission must not mutate runtime/core" >&2
            exit 1
          fi
          if git ls-files | grep -E '(^|/)(P5A_D2_EXECUTION_RESULT|P5A_D2_ADJUDICATION|P5A_D2_RESULT|result)\.json$'; then
            echo "Fresh D2 outcome evidence exists before final admission" >&2
            exit 1
          fi

      - name: Compile
        run: python -m compileall -q src/g2e src/gwr scripts/g2e/p5a_d2_final_admission.py

      - name: Run P1 regression
        run: pytest -q tests/g2e/test_p1_core_schemas.py

      - name: Run P1.4 regression
        run: pytest -q tests/g2e/test_p1_4_agent_binding.py

      - name: Run P1.5 regression
        run: pytest -q tests/g2e/test_p1_5_qualification_authority.py

      - name: Run P2 regression
        run: pytest -q tests/g2e/test_p2_deterministic_core.py

      - name: Run P3 regression
        run: pytest -q tests/g2e/test_p3_standalone_runtime.py

      - name: Run P4 regression
        run: pytest -q tests/g2e/test_p4_gwf_adapter.py

      - name: Run final-admission qualification
        run: pytest -q tests/g2e/test_p5a_d2_final_admission.py

      - name: Materialize exact final-admission graph
        run: python scripts/g2e/p5a_d2_final_admission.py --output-dir p5a_d2_final_admission

      - name: Re-verify materialized pack independently
        shell: bash
        run: |
          python - <<'PY'
          import importlib.util, json
          from pathlib import Path

          path = Path("scripts/g2e/p5a_d2_final_admission.py")
          spec = importlib.util.spec_from_file_location("final_admission_verify", path)
          module = importlib.util.module_from_spec(spec)
          assert spec and spec.loader
          spec.loader.exec_module(module)
          pack = json.loads(Path("p5a_d2_final_admission/P5A_D2_FINAL_ADMISSION.json").read_text(encoding="utf-8"))
          module.verify_final_admission(pack)
          assert pack["model_turn_executed"] is False
          assert pack["fresh_outcome_consumed"] is False
          assert pack["d2_scientific_attempts_authorized_after_gate"] == 1
          PY

      - name: Emit qualification report
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path

          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()

          pack_path = Path("p5a_d2_final_admission/P5A_D2_FINAL_ADMISSION.json")
          raw = pack_path.read_bytes()
          pack = json.loads(raw)
          files = {}
          for path in sorted(Path("p5a_d2_final_admission").glob("*.json")):
              files[path.name] = hashlib.sha256(path.read_bytes()).hexdigest()

          report = {
              "schema": "G2E-P5A-D2-FINAL-ADMISSION-QUALIFICATION-v1",
              "candidate_sha": git("rev-parse", "HEAD"),
              "baseline_sha": "926d6a46344e8ac4822907fdc6b597f8d6ba6feb",
              "spec_blob": git("rev-parse", "HEAD:g2e/docs/P5A_D2_FINAL_ADMISSION_MATERIALIZATION_AND_ZERO_FRESH_QUALIFICATION.md"),
              "builder_blob": git("rev-parse", "HEAD:scripts/g2e/p5a_d2_final_admission.py"),
              "test_blob": git("rev-parse", "HEAD:tests/g2e/test_p5a_d2_final_admission.py"),
              "workflow_blob": git("rev-parse", "HEAD:.github/workflows/g2e-p5a-d2-final-admission.yml"),
              "adjudication": "FINAL_ADMISSION_PASS",
              "pack_file_sha256": hashlib.sha256(raw).hexdigest(),
              "materialized_files_sha256": files,
              "authority_policy_ref": pack["refs"]["authority_policy"],
              "qualification_grant_ref": pack["refs"]["qualification_authority_grant"],
              "final_agent_binding_ref": pack["refs"]["final_agent_binding"],
              "predispatch_attempt_ref": pack["refs"]["predispatch_attempt"],
              "execution_config_hash": pack["execution_config_hash"],
              "fresh_d2_outcome_consumed": False,
              "model_turn_executed": False,
              "d2_scientific_attempts_authorized_after_gate": 1,
              "runtime_adapter_authorized": False,
          }
          Path("p5a_d2_final_admission_report.json").write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          print(json.dumps(report, indent=2, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: g2e-p5a-d2-final-admission
          path: |
            p5a_d2_final_admission/*.json
            p5a_d2_final_admission_report.json
          if-no-files-found: error
