name: DG-P0 External Validator Foundation Gate

on:
  workflow_dispatch:
  push:
    branches: ["main", "dg/p0-external-validator-foundation"]
  pull_request:
    branches: ["main", "docs/reference-agent-interop-specs"]

permissions:
  contents: read

jobs:
  dg-p0:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install GWF test dependencies
        run: python -m pip install -U pip && pip install -e ".[dev]"
      - name: Install exact markdownlint-cli2
        run: npm install --global --ignore-scripts markdownlint-cli2@0.23.3
      - name: Show pinned validator package
        run: npm list --global markdownlint-cli2 --depth=0
      - name: Run DG-P0 unit tests
        run: python -m pytest -q tests/test_dg_p0_document_validation.py
      - name: Run DG-P0 real-tool gate
        run: python tools/run_dg_p0_gate.py --out evidence/dg-p0/${{ runner.os }}/DG_P0_GATE.json
      - name: Compile Python sources
        run: python -m compileall -q src tests tools
      - name: Run existing regression tests
        if: runner.os == 'Linux'
        run: python -m pytest -q tests/test_v084_github_plugin_sha_qa.py tests/test_v085_domain_skills.py
      - name: Upload DG-P0 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dg-p0-${{ runner.os }}-evidence
          path: evidence/dg-p0/${{ runner.os }}
