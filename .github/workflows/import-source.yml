name: Import complete v0.5.1r1 source

on:
  push:
    paths:
      - "SOURCE_IMPORT_TRIGGER"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify canonical source archive
        shell: bash
        run: |
          set -euo pipefail
          echo "c838d1fe2fbd2a7c1c38c2b54a510ff713e3fbc87877cc499f3c9d23a80bb4a9  canonical/source-v0.5.1r1.tar.xz" | sha256sum -c -
          xz -t canonical/source-v0.5.1r1.tar.xz

      - name: Extract and verify canonical source tree
        shell: bash
        run: |
          set -euo pipefail
          tar -xJf canonical/source-v0.5.1r1.tar.xz
          python - <<'PY'
          from pathlib import Path
          roots=['pyproject.toml','README.md','.github','migrations','datasets','domains','benchmarks','tests','spec','src','docs','tools']
          files=[]
          for x in roots:
              p=Path(x)
              if p.is_file(): files.append(p)
              elif p.is_dir(): files.extend(q for q in p.rglob('*') if q.is_file())
          # import-source.yml is repository bootstrap infrastructure, not part of canonical package.
          files=[p for p in files if p.as_posix() != '.github/workflows/import-source.yml']
          assert len(files)==116, (len(files), [p.as_posix() for p in files])
          payload=sum(p.stat().st_size for p in files)
          assert payload==682582, payload
          print(f'canonical source verified: files={len(files)} bytes={payload}')
          PY

      - name: Commit expanded canonical source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md pyproject.toml benchmarks datasets domains migrations src tests tools spec docs .github/workflows/postgres-gate.yml
          if git diff --cached --quiet; then
            echo "Canonical v0.5.1r1 source already expanded; nothing to commit."
          else
            git commit -m "chore: import complete canonical v0.5.1r1 source"
            git push origin HEAD:main
          fi
