[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "governed-workflow-runtime"
version = "0.7.0"
description = "Domain-neutral governed workflow runtime with artifact validity, execution, recovery, and authority kernels"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0", "pydantic>=2.0", "fastapi>=0.100"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27"]
postgres = ["psycopg[binary]>=3.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
